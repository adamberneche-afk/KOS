version: 2
updates:
  # Root package.json (tests/ runner) — added alongside this file; zero
  # runtime dependencies today (Node's built-in test runner only), but this
  # keeps it covered the moment that changes.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # kos-personal/inference-service is DORMANT (D16, 2026-11-01): INFERENCE_MODE
  # is hard-coded to Studio and its Cloud Run deploy needs Google Cloud, which
  # is off for the district. Its weekly version bumps stopped here; GitHub's
  # security alerts, where enabled, still cover it. Put the entry back if it
  # is ever deployed:
  #   - package-ecosystem: "npm"
  #     directory: "/kos-personal/inference-service"
  #     schedule:
  #       interval: "weekly"

  # GitHub Actions itself (actions/checkout, actions/setup-node, etc.) —
  # covers .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
