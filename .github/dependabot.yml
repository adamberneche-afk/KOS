version: 2
updates:
  # Root package.json (tests/ runner) — added alongside this file; zero
  # runtime dependencies today (Node's built-in test runner only), but this
  # keeps it covered the moment that changes.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # kos-personal/inference-service was archived 2026-11-17 (clean-up C3;
  # archive/2026-27-Q2/kos-personal/archive/inference-service/): no entry here.

  # GitHub Actions itself (actions/checkout, actions/setup-node, etc.) —
  # covers .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
