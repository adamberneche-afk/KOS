name: CodeQL

# Scans every .js/.gs file in the repo (CodeQL's javascript analyzer treats
# .gs the same as .js — both are plain ECMAScript, just running on a
# different host) plus student-leader-hub.html's inline <script> blocks,
# which CodeQL's JS extractor already knows how to pull out of HTML on its
# own. Nothing here existed before this workflow — this repo had zero
# automated security scanning of its ~57,000 lines of JS across
# kos-personal/, cas-ccps/, leader-hub/, and tools/.
# NOT YET on push/pull_request, unlike a normal CodeQL setup - the real
# first run here got past both the scan itself (63/63 JS files extracted
# fine) and the `actions: read` permission this file's own history
# already fixed once, then failed a second, different way on the SARIF
# upload step: "Code scanning is not enabled for this repository. Please
# enable code scanning in the repository settings." That's a repository
# Settings toggle (Settings -> Code security and analysis -> Code
# scanning; on a private repo this may also require GitHub Advanced
# Security to be enabled first), not a workflow bug - no commit to this
# file can fix it, and leaving push/pull_request wired up in the meantime
# would put a permanently-red, unfixable-by-code check on every future
# PR. Same "don't add a check that fails for reasons no commit can
# address" reasoning doctor.yml already documents for itself.
#
# Once Code scanning is confirmed enabled (run this workflow once via
# workflow_dispatch and confirm the Actions tab shows success, not this
# same error), restore `push`/`pull_request` here so it actually gates
# PRs going forward.
on:
  schedule:
    # Weekly, independent of any push — catches a newly-disclosed advisory
    # in an existing pattern even on a week nobody touches this repo.
    - cron: '0 8 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # FIXED: this repo is private, and the codeql-action/analyze step
      # calls GitHub's "get a workflow run" API internally to build its
      # status/coverage reporting - GitHub's own CodeQL docs list
      # `actions: read` as required specifically for private repos (public
      # repos don't need it). Without it, the first real run here failed
      # with "Resource not accessible by integration" against exactly that
      # endpoint, after the scan itself had already completed successfully -
      # the analysis wasn't wrong, the job just couldn't report its own
      # status back.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # Never scan generated/checked-out build scratch — cas-ccps's
          # per-project clasp push folders are regenerated on demand (see
          # tools/clasp-sync/README.md) and gitignored; if one happens to
          # exist locally it's a duplicate of scripts/ already scanned.
          config: |
            paths-ignore:
              - 'cas-ccps/.clasp-build/**'
              - '**/node_modules/**'

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'
