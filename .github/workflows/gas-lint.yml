name: gas-lint

# tools/gas-lint/check.js is a repo-owned static analyzer for the
# Google Apps Script systems in this repo (kos-personal, cas-ccps). It
# already exits non-zero on any error-level finding — this workflow is
# the only thing missing to make "run before trusting any change" an
# enforced gate instead of a README instruction someone has to remember.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gas-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run gas-lint
        run: node tools/gas-lint/check.js
      - name: Verify cas-ccps clasp-sync builds cleanly
        run: node tools/clasp-sync/sync.js
      - name: Run the leader-hub + tooling regression suite (tests/)
        # Rebuilds the coverage leader-hub/README.md describes past
        # sessions getting from ad hoc, never-committed Node harnesses
        # (verify_ee2.js, verify_gg1.js, etc.) as a permanent, CI-enforced
        # asset instead — see tests/leaderhub/*.test.js and
        # tests/harness/*.js. Zero dependencies (Node's built-in test
        # runner + vm module only), so no install step is needed here.
        #
        # FIXED: a quoted "tests/**/*.test.js" left glob expansion to
        # Node's own --test path handling, which behaves differently
        # across Node versions - it silently found nothing ("Could not
        # find '.../tests/**/*.test.js'", exit 1) on the Node 20.20.2
        # this workflow actually pins, despite passing locally on a
        # newer Node during development. Unquoted, explicit per-directory
        # globs are expanded by the shell BEFORE node ever sees them, so
        # this doesn't depend on any Node version's own glob support.
        run: node --test tests/leaderhub/*.test.js tests/tools/*.test.js
      - name: Syntax-check student-leader-hub.html's inline <script> blocks
        # The enforced version of the "Verified with node --check on both
        # <script> blocks" note leader-hub/README.md repeats after nearly
        # every round of changes to this file — see tools/html-lint/.
        run: |
          node tools/html-lint/check.js \
            leader-hub/student-leader-hub.html \
            leader-hub/archived/studentleaderhub_EARLY_PROTOTYPE.html
      - name: Lint this repo's own GitHub Actions workflow files
        # Catches exactly the class of bug that broke this file once already
        # (a bare `secrets.X` reference inside an `if:` conditional, which
        # GitHub rejects at parse time with zero jobs ever running — a
        # generic YAML parser like PyYAML/js-yaml doesn't catch this, since
        # it's a GitHub Actions expression-context rule, not a YAML syntax
        # error). Official install method, no third-party marketplace action.
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  # This repo has six READMEs, not one (root plus one per top-level system) —
  # a straight port of a single-README docs-check would be wrong here: a new
  # file under cas-ccps/ needs cas-ccps/README.md touched, not just any
  # README in the repo. Ported from Mothership's own docs-check job
  # (.github/workflows/ci.yml there) with that mapping added.
  docs-check:
    runs-on: ubuntu-latest
    # Only meaningful against a PR's own diff - the "did docs come along
    # with this new file" question doesn't apply to a push/workflow_dispatch
    # run, which has no base to diff against.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone - needed to diff
          # reliably against the PR's base sha below.
          fetch-depth: 0

      - name: Require the matching system's README updated alongside new capability files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          if echo "$PR_TITLE $PR_BODY" | grep -qi '\[skip-docs-check\]'; then
            echo "Skip marker found - not requiring a README update for this PR."
            exit 0
          fi

          added_files=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA")
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          fail=0
          for dir in cas-ccps kos-personal leader-hub drive-curation meta; do
            new_in_dir=$(echo "$added_files" | grep -E "^${dir}/" | grep -v "^${dir}/README\.md$" || true)
            if [ -z "$new_in_dir" ]; then continue; fi
            if echo "$changed_files" | grep -qx "${dir}/README.md"; then
              echo "New file(s) under $dir/ and $dir/README.md was updated in the same PR:"
              echo "$new_in_dir"
              continue
            fi
            echo "::error::This PR adds new file(s) under $dir/ but never touches $dir/README.md:"
            echo "$new_in_dir"
            fail=1
          done

          # A new top-level file (not inside any of the five systems above)
          # is checked against the root README instead.
          new_at_root=$(echo "$added_files" | grep -vE "^(cas-ccps|kos-personal|leader-hub|drive-curation|meta)/" | grep -v '^README\.md$' || true)
          if [ -n "$new_at_root" ]; then
            if echo "$changed_files" | grep -qx 'README.md'; then
              echo "New top-level file(s) and README.md was updated in the same PR:"
              echo "$new_at_root"
            else
              echo "::error::This PR adds new top-level file(s) but never touches README.md:"
              echo "$new_at_root"
              fail=1
            fi
          fi

          if [ "$fail" = "1" ]; then
            echo ""
            echo "Update the matching README to describe what this adds, or add '[skip-docs-check]' to the PR title/description if this genuinely needs no documentation."
            exit 1
          fi

  # kos-personal/inference-service is the one real Node service in this
  # repo (Postgres + Stripe + OAuth) and, until this job, had zero
  # automated tests and zero CI coverage of any kind — nothing here
  # installed its dependencies, let alone ran anything against them.
  # Independent of gas-lint (no `needs:`) since it's unrelated to the GAS
  # systems that job/the sandbox-deploy chain below cover — this way a
  # failure in one doesn't block investigating the other, and both run in
  # parallel rather than one waiting on the other.
  test-inference-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kos-personal/inference-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kos-personal/inference-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        # See test/credits.test.js's own header comment for how this
        # exercises real db.js logic (deductCredits/addCredits/
        # markJobFailed) against an in-memory fake Postgres pool, with no
        # real DATABASE_URL, Stripe key, or network access needed.
        run: npm test

  # ── Sandbox deploy (R10 — tools/clasp-sync/DEPLOYMENT_RUNBOOK.md §3.5) ──
  # Pushes HEAD to disconnected *sandbox* copies of the cas-ccps/kos-personal
  # projects — never the real district-owned production projects (see the
  # runbook's own "practice field vs. real stadium" framing). Chained after
  # gas-lint via `needs:` (only possible because this job lives in the same
  # workflow file, not a separate one) so a lint failure blocks a sandbox
  # push. Only fires on a push to main — not every branch/PR, to avoid
  # sandbox-pushing work-in-progress code.
  #
  # Needs two repo secrets, NEITHER of which exists yet as of this commit —
  # see the sandbox-deploy-not-configured job below for the visible status
  # this shows in the meantime:
  #   CLASP_SANDBOX_CREDENTIALS — the *contents* of a sandbox-only Google
  #     account's ~/.clasprc.json (from running `clasp login` on that
  #     account, never the district/production account). Treat like a
  #     password; rotate periodically (re-run clasp login, update the
  #     secret).
  #   CAS_SANDBOX_SCRIPT_IDS — one JSON object mapping every project this
  #     job pushes to its own *sandbox* Script ID, e.g.:
  #       {"central-ledger":"...", "unified-manual":"...",
  #        "master-student-template":"...", "rubric-response-sheet":"...",
  #        "teacher-matrix-sheet":"...", "teacher-dashboard":"...",
  #        "student-dashboard":"...", "kos-personal":"..."}
  #     Each ID comes from the runbook's §3.2 sandbox-copy process (Drive →
  #     Make a copy → Extensions → Apps Script → Project Settings → Script
  #     ID) — none of these sandbox copies exist yet either; build them
  #     before this secret means anything. A project missing from this map
  #     is skipped (logged, not a failure) rather than blocking the rest.
  #     One combined secret instead of one-per-project purely to keep repo
  #     secrets management from growing to 8+ entries — the runbook's own
  #     illustrative job didn't spell out where these files come from in
  #     CI (cas-ccps/clasp/local/ is gitignored, so a fresh checkout never
  #     has them); this fills that gap.
  #
  # GitHub Actions does not allow a bare `secrets.X` reference inside an
  # `if:` conditional (only inside `env:`/step bodies) — an earlier version
  # of this file tried that directly and GitHub rejected the whole workflow
  # at parse time (0 jobs ever ran, both pushes showed "failure" with no
  # job list). This job below reads the secrets into a plain string output
  # instead, and every `if:` downstream compares against that output, never
  # against `secrets.*` directly.
  check-sandbox-secrets:
    needs: [gas-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "$HAS_CREDS" ] && [ -n "$HAS_IDS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HAS_CREDS: ${{ secrets.CLASP_SANDBOX_CREDENTIALS }}
          HAS_IDS: ${{ secrets.CAS_SANDBOX_SCRIPT_IDS }}

  sandbox-deploy:
    needs: [gas-lint, check-sandbox-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-sandbox-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - name: Restore sandbox-account clasp credentials
        run: echo "$CLASP_SANDBOX_CREDENTIALS" > "$HOME/.clasprc.json"
        env:
          CLASP_SANDBOX_CREDENTIALS: ${{ secrets.CLASP_SANDBOX_CREDENTIALS }}
      - name: Materialize sandbox .clasp.json files from the ID map secret
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const ids = JSON.parse(process.env.CAS_SANDBOX_SCRIPT_IDS);
            const casNames = ["central-ledger","unified-manual","master-student-template","rubric-response-sheet","teacher-matrix-sheet","teacher-dashboard","student-dashboard"];
            fs.mkdirSync("cas-ccps/clasp/local", { recursive: true });
            for (const name of casNames) {
              if (!ids[name]) { console.warn("No sandbox Script ID for " + name + " in CAS_SANDBOX_SCRIPT_IDS — that project will be skipped."); continue; }
              fs.writeFileSync(
                path.join("cas-ccps/clasp/local", name + ".clasp.json"),
                JSON.stringify({ scriptId: ids[name], rootDir: "." }, null, 2)
              );
            }
            if (ids["kos-personal"]) {
              fs.writeFileSync("kos-personal/.clasp.json", JSON.stringify({ scriptId: ids["kos-personal"], rootDir: "." }, null, 2));
            } else {
              console.warn("No sandbox Script ID for kos-personal in CAS_SANDBOX_SCRIPT_IDS — that push will be skipped.");
            }
          '
        env:
          CAS_SANDBOX_SCRIPT_IDS: ${{ secrets.CAS_SANDBOX_SCRIPT_IDS }}
      - name: Rebuild and push HEAD-safe web apps (teacher-dashboard, student-dashboard)
        run: |
          for p in teacher-dashboard student-dashboard; do
            if [ ! -f "cas-ccps/clasp/local/$p.clasp.json" ]; then echo "Skipping $p — no sandbox Script ID configured."; continue; fi
            node tools/clasp-sync/sync.js "$p"
            (cd "cas-ccps/.clasp-build/$p" && clasp push --force)
          done
      - name: Rebuild and push sandbox copies of the five trigger-driven projects
        run: |
          for p in central-ledger unified-manual master-student-template rubric-response-sheet teacher-matrix-sheet; do
            if [ ! -f "cas-ccps/clasp/local/$p.clasp.json" ]; then echo "Skipping $p — no sandbox Script ID configured."; continue; fi
            node tools/clasp-sync/sync.js "$p"
            (cd "cas-ccps/.clasp-build/$p" && clasp push --force)
          done
      - name: kos-personal (no live audience — safe to fold in here too)
        run: |
          if [ -f "kos-personal/.clasp.json" ]; then
            (cd kos-personal && clasp push)
          else
            echo "Skipping kos-personal — no sandbox Script ID configured."
          fi

  # A visible, always-green placeholder so "the sandbox-deploy job doesn't
  # even show up" doesn't get mistaken for "it's broken" — runs only when
  # the real job above would be skipped for lack of configuration, and
  # just says so plainly, with a pointer to what to add.
  sandbox-deploy-not-configured:
    needs: [gas-lint, check-sandbox-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-sandbox-secrets.outputs.configured == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "sandbox-deploy is not configured yet — two repo secrets are missing:"
          echo "  CLASP_SANDBOX_CREDENTIALS  (a sandbox-only account's clasp login)"
          echo "  CAS_SANDBOX_SCRIPT_IDS     (a JSON map of project name -> sandbox Script ID)"
          echo "See this workflow file's own comment above the sandbox-deploy job, and"
          echo "tools/clasp-sync/DEPLOYMENT_RUNBOOK.md sections 3.2 and 3.5, for how to set these up."
