<!-- Warm-up points (80b_WarmUpPointsPanel.js): each student's points by
     term, opened from More ▾. Read-only. -->
<div class="modal-backdrop" id="wup-modal-backdrop" onclick="if(event.target===this)closeWarmUpPoints()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wup-modal-title" style="max-width:820px">
    <div class="modal-header">
      <h2 id="wup-modal-title">Warm-up points</h2>
      <button class="modal-close" onclick="closeWarmUpPoints()" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="wup-modal-body">
      <p style="font-size:13px;color:var(--text-secondary)">Loading…</p>
    </div>
  </div>
</div>
<script>
let _wup = null;
let _wupTerm = "";
let _wupCourse = "";
let _wupSort = "name";

function openWarmUpPoints() {
  _openPanel("wup-modal-backdrop", closeWarmUpPoints);
  document.getElementById("wup-modal-body").innerHTML =
    '<p style="font-size:13px;color:var(--text-secondary)">Loading…</p>';
  google.script.run
    .withSuccessHandler(function (d) { _wup = d; _wupTerm = (d && d.currentTerm) || ""; renderWarmUpPoints(); })
    .withFailureHandler(function (e) {
      document.getElementById("wup-modal-body").innerHTML = '<p style="color:#b3261e;font-size:13px">Could not load: ' +
        esc(e && e.message ? e.message : "unknown error") + '</p>';
    })
    .getWarmUpPoints();
}

function closeWarmUpPoints() { _closePanel("wup-modal-backdrop"); }

// One student's points for the chosen term, or the whole year summed.
function _wupPoints(st) {
  const keys = _wupTerm === "*" ? Object.keys(st.terms) : [_wupTerm];
  const p = { delivered: 0, scored: 0, earned: 0, extra: 0, possible: 0 };
  keys.forEach(function (k) {
    const t = st.terms[k];
    if (!t) return;
    ["delivered", "scored", "earned", "extra", "possible"].forEach(function (f) { p[f] += t[f]; });
  });
  p.percent = p.possible ? Math.round(100 * p.earned / p.possible) : null;
  return p;
}

function _wupSetSort(key) { _wupSort = key; renderWarmUpPoints(); }

function renderWarmUpPoints() {
  const body = document.getElementById("wup-modal-body");
  const d = _wup;
  if (!d || !d.success) {
    body.innerHTML = '<p style="color:#b3261e;font-size:13px">' + esc((d && d.error) || "Could not load warm-up points.") + '</p>';
    return;
  }
  const courses = [];
  d.students.forEach(function (s) { s.courses.forEach(function (c) { if (courses.indexOf(c) < 0) courses.push(c); }); });
  courses.sort();
  const rows = d.students
    .filter(function (s) { return !_wupCourse || s.courses.indexOf(_wupCourse) >= 0; })
    .map(function (s) { return { s: s, p: _wupPoints(s) }; })
    .filter(function (r) { return r.p.delivered > 0; });
  rows.sort(function (a, b) {
    if (_wupSort === "percent") return (a.p.percent === null ? 101 : a.p.percent) - (b.p.percent === null ? 101 : b.p.percent);
    if (_wupSort === "period") return String(a.s.periods[0] || "").localeCompare(String(b.s.periods[0] || ""), undefined, { numeric: true });
    return a.s.name.localeCompare(b.s.name);
  });
  let html = '<p style="font-size:13px;color:var(--text-secondary)">Each warm-up a student was given is worth ' + esc(String(d.max)) +
    ' points once its day has passed. One not answered, or not checked yet (checking runs overnight), counts 0. ' +
    'Extra credit is added on top and is not part of the percentage. Students see their own total, not this table.</p>';
  html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;font-size:13px">' +
    '<label>Term <select id="wup-term" onchange="_wupTerm=this.value;renderWarmUpPoints()">' +
    d.terms.map(function (t) {
      return '<option value="' + esc(t.term) + '"' + (t.term === _wupTerm ? ' selected' : '') + '>' + esc(t.label) +
        (t.term === d.currentTerm ? ' (now)' : '') + '</option>';
    }).join("") +
    '<option value="*"' + (_wupTerm === "*" ? ' selected' : '') + '>Whole school year</option></select></label>' +
    '<label>Course <select id="wup-course" onchange="_wupCourse=this.value;renderWarmUpPoints()">' +
    '<option value="">All courses</option>' + courses.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === _wupCourse ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join("") + '</select></label></div>';
  if (!rows.length) {
    body.innerHTML = html + '<p style="font-size:13px">No warm-ups delivered for this term and course yet.</p>';
    return;
  }
  const th = function (key, label) {
    return '<th style="padding:4px"><button type="button" class="link-btn" onclick="_wupSetSort(\'' + key + '\')" aria-pressed="' +
      (_wupSort === key) + '" style="background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;' +
      (_wupSort === key ? 'text-decoration:underline' : '') + '">' + label + '</button></th>';
  };
  html += '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="text-align:left;color:var(--text-secondary)">' +
    th("name", "Student") + th("period", "Period") + '<th style="padding:4px">Points</th>' + th("percent", "%") +
    '<th style="padding:4px">Checked</th><th style="padding:4px">Extra credit</th></tr>';
  let earned = 0, possible = 0;
  rows.forEach(function (r) {
    earned += r.p.earned;
    possible += r.p.possible;
    html += '<tr style="border-top:1px solid #e8eaed">' +
      '<td style="padding:6px 4px">' + esc(r.s.name) + (r.s.courses.length ? '' : ' <span style="color:var(--text-secondary)">(not on the roster)</span>') + '</td>' +
      '<td style="padding:6px 4px">' + esc(r.s.periods.join(", ")) + '</td>' +
      '<td style="padding:6px 4px">' + esc(String(r.p.earned)) + ' / ' + esc(String(r.p.possible)) + '</td>' +
      '<td style="padding:6px 4px">' + (r.p.percent === null ? '—' : esc(String(r.p.percent)) + '%') + '</td>' +
      '<td style="padding:6px 4px">' + esc(String(r.p.scored)) + ' of ' + esc(String(r.p.delivered)) + '</td>' +
      '<td style="padding:6px 4px">' + (r.p.extra ? '+' + esc(String(r.p.extra)) : '') + '</td></tr>';
  });
  html += '<tr style="border-top:2px solid #dadce0;font-weight:600"><td style="padding:6px 4px">Class</td><td></td>' +
    '<td style="padding:6px 4px">' + esc(String(earned)) + ' / ' + esc(String(possible)) + '</td>' +
    '<td style="padding:6px 4px">' + (possible ? esc(String(Math.round(100 * earned / possible))) + '%' : '—') + '</td><td></td><td></td></tr></table>';
  body.innerHTML = html;
}
</script>
