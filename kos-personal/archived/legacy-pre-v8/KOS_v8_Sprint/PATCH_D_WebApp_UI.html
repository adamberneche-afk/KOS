<script>
// ── Mirror Matrix ────────────────────────────────────────────────

// When false, only shows variables with confidence > 0.
// When true, shows all 25 variables including silent ones.
var showMirrorAll = false;

function loadMirrorStatus() {
  const el      = document.getElementById('mirror-status');
  const summary = document.getElementById('mirror-summary-row');
  const sync    = document.getElementById('mirror-sync-line');
  const toggleBtn = document.getElementById('mirror-toggle-btn');

  el.innerHTML = '<div class="mirror-empty">Loading…</div>';

  callServer('getMirrorMatrixStatus', [], function(res) {
    if (!res || !res.success) {
      el.innerHTML = '<div class="mirror-empty">Error: ' +
        esc((res && res.message) || 'Unknown error') + '</div>';
      return;
    }

    // Summary pills
    summary.style.display = 'flex';
    summary.innerHTML =
      '<span class="mirror-pill pending">'      + res.pending      + ' pending</span>'   +
      '<span class="mirror-pill hypothesized">' + res.hypothesized + ' hypothesized</span>' +
      '<span class="mirror-pill verified">'     + res.verified     + ' verified</span>';

    // Sync line
    const total = res.total || 0;
    const active = (res.hypothesized || 0) + (res.verified || 0);
    sync.textContent = active + ' of ' + total + ' variables active';

    // Toggle button label
    toggleBtn.textContent = showMirrorAll ? 'Show active only' : 'Show all variables';

    // Variable list
    const vars = res.variables || [];
    const toShow = showMirrorAll
      ? vars
      : vars.filter(function(v) { return v.confidence > 0; });

    if (toShow.length === 0) {
      el.innerHTML = showMirrorAll
        ? '<div class="mirror-empty">No variables found.</div>'
        : '<div class="mirror-empty">No observations yet — confidence builds passively as sessions are processed.</div>';
      return;
    }

    el.innerHTML = toShow.map(function(v) {
      var fillClass  = v.status === 'VERIFIED' ? 'mirror-fill verified' : 'mirror-fill';
      var pct        = Math.round((v.confidence || 0) * 100);
      var verifyBtn  = v.status === 'HYPOTHESIZED'
        ? '<button class="btn-verify" onclick="handleVerifyMirror(\'' +
          esc(v.key) + '\')">Verify</button>'
        : '';
      var valueText  = v.value
        ? '<div style="font-size:10px;color:var(--text-secondary);margin-top:3px;' +
          'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
          esc(String(v.value).substring(0, 60)) +
          (String(v.value).length > 60 ? '…' : '') +
          '</div>'
        : '';

      return '<div class="mirror-row">' +
        '<div>' +
          '<div class="mirror-label">' + esc(v.label || v.key) + '</div>' +
          valueText +
        '</div>' +
        '<span class="mirror-status ' + esc(v.status.toLowerCase()) + '">' +
          esc(v.status) +
        '</span>' +
        '<div>' +
          '<div class="mirror-bar"><div class="' + fillClass + '" style="width:' + pct + '%"></div></div>' +
          '<div style="font-size:9px;color:var(--text-secondary);text-align:right;margin-top:2px">' +
            pct + '%' +
          '</div>' +
          verifyBtn +
        '</div>' +
      '</div>';
    }).join('');
  });
}

function handleVerifyMirror(key) {
  if (!key) return;
  var label = key.replace(/_/g, ' ');
  var val   = prompt('Confirm the inferred value for "' + label + '":\n(Leave blank to confirm the existing inference)');
  if (val === null) return;  // user cancelled

  callServer('verifyMirrorVariable', [key, val || undefined], function(res) {
    if (res === true || (res && res.success !== false)) {
      showDiagStatus('"' + label + '" verified and locked.');
      loadMirrorStatus();
    } else {
      showDiagStatus('Verification failed: ' + esc((res && res.message) || 'Unknown error'));
    }
  });
}


// ── Zone Health ──────────────────────────────────────────────────

function loadZoneHealth() {
  var el   = document.getElementById('zone-status');
  var sync = document.getElementById('zone-sync-line');
  el.innerHTML = '<div class="mirror-empty">Loading…</div>';

  callServer('getZoneHealth', [], function(res) {
    if (!res || !res.success) {
      el.innerHTML = '<div class="mirror-empty">Error: ' +
        esc((res && res.message) || 'Unknown error') + '</div>';
      return;
    }

    var zones   = res.zones || [];
    var okCount = zones.filter(function(z) { return z.ok; }).length;
    sync.textContent = okCount + ' of ' + zones.length + ' zones provisioned';

    el.innerHTML = '<div class="zone-grid">' +
      zones.map(function(z) {
        return '<div class="zone-card ' + (z.ok ? 'ok' : 'missing') + '">' +
          '<div class="zone-status-dot">' + (z.ok ? '🟢' : '🔴') + '</div>' +
          '<div class="zone-name">' + esc(z.name) + '</div>' +
          (z.url
            ? '<a class="zone-link" href="' + esc(z.url) + '" target="_blank">Open in Drive ↗</a>'
            : '<span style="font-size:10px;color:#f87171">Not provisioned</span>') +
        '</div>';
      }).join('') +
    '</div>';
  });
}

function handleInitKOS() {
  var btn = document.getElementById('init-kos-btn');
  if (!btn) return;

  if (btn.dataset.confirm !== 'yes') {
    btn.textContent    = 'Tap again to confirm';
    btn.dataset.confirm = 'yes';
    setTimeout(function() {
      btn.textContent     = 'Initialize Zones';
      btn.dataset.confirm = '';
    }, 5000);
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Initializing…';
  btn.dataset.confirm = '';

  callServer('initializeKOSFromUI', [], function(res) {
    btn.disabled    = false;
    btn.textContent = 'Initialize Zones';

    if (!res || !res.success) {
      showDiagStatus('Zone init error: ' + esc((res && res.message) || 'Unknown error'));
    } else {
      var lines = [];
      if (res.provisioned && res.provisioned.length) lines.push('Provisioned: ' + res.provisioned.join(', '));
      if (res.verified    && res.verified.length)    lines.push('Verified: '    + res.verified.join(', '));
      if (res.warnings    && res.warnings.length)    lines.push('⚠ ' + res.warnings.length + ' warning(s) — check Error Log');
      showDiagStatus(lines.join(' · ') || 'Zones ready.');
      loadZoneHealth();
    }
  });
}


// ── Turnstile status — called from loadQueueStatus ───────────────
// Reads the STAGING_PIPELINE status counts and renders a Turnstile
// badge showing whether the system is CLEAR, IN_PROCESS, or has
// PENDING_FLOW rows waiting. Appended to the existing metrics row.

function renderTurnstileStatus(rows) {
  var existing  = document.getElementById('turnstile-badge');
  if (!existing) return;

  var inProcess   = rows.filter(function(r) { return String(r.status) === 'IN_PROCESS'; }).length;
  var pending     = rows.filter(function(r) { return String(r.status) === 'PENDING_FLOW'; }).length;

  var cls, label;
  if (inProcess > 0) {
    cls   = 'active';
    label = '⚙ Turnstile: IN_PROCESS';
  } else if (pending > 0) {
    cls   = 'congested';
    label = '⏳ Turnstile: ' + pending + ' waiting';
  } else {
    cls   = 'clear';
    label = '✓ Turnstile: clear';
  }

  existing.className  = 'turnstile-badge ' + cls;
  existing.textContent = label;
}
</script>
