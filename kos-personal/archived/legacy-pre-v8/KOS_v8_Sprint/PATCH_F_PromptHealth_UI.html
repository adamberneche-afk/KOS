<!-- F-2  HTML — paste after Zone Health section-card             -->

<!-- Prompt Health Panel -->
<div class="section-card" id="prompt-panel">
  <div class="section-header">
    <span class="section-icon">📄</span>
    <span class="section-title">Studio Prompts</span>
    <span class="sync-line" id="prompt-sync-line"></span>
  </div>
  <div id="prompt-status">
    <div class="mirror-empty">Loading prompt documents…</div>
  </div>
  <div class="prompt-actions">
    <button class="btn btn-ghost"      onclick="loadPromptHealth()">Refresh</button>
    <button class="btn btn-secondary"  id="build-system-prompt-btn"
            onclick="handleBuildPrompt('system')">Rebuild System Prompt</button>
    <button class="btn btn-ghost"      id="build-silo-prompt-btn"
            onclick="handleBuildPrompt('silo')">Rebuild Silo Prompt</button>
  </div>
</div>


<!-- ============================================================ -->
<!-- F-3  JavaScript                                               -->
<!-- ============================================================ -->
<script>

function loadPromptHealth() {
  var el   = document.getElementById('prompt-status');
  var sync = document.getElementById('prompt-sync-line');
  el.innerHTML = '<div class="mirror-empty">Loading…</div>';

  callServer('getPromptHealth', [], function(res) {
    if (!res || !res.success) {
      el.innerHTML = '<div class="mirror-empty">Error: ' +
        esc((res && res.message) || 'Unknown error') + '</div>';
      return;
    }

    // Sync line shows last build timestamp
    sync.textContent = res.builtAt
      ? 'Last built: ' + new Date(res.builtAt).toLocaleString()
      : 'Never built';

    var rows = [
      { label: 'System Prompt', doc: res.systemPrompt },
      { label: 'Silo Prompt',   doc: res.siloPrompt   },
    ];

    el.innerHTML = rows.map(function(row) {
      var doc = row.doc || {};
      var ok  = doc.exists && doc.id;
      return '<div class="prompt-row">' +
        '<div class="prompt-dot">' + (ok ? '🟢' : '🔴') + '</div>' +
        '<div class="prompt-body">' +
          '<div class="prompt-name">' + esc(row.label) + '</div>' +
          (doc.name
            ? '<div class="prompt-meta">' + esc(doc.name) + '</div>'
            : '<div class="prompt-meta" style="color:#f87171">Not built yet</div>') +
          (doc.url
            ? '<a class="prompt-link" href="' + esc(doc.url) + '" target="_blank">Open in Drive ↗</a>'
            : '') +
          (doc.id
            ? '<div class="prompt-id">' + esc(doc.id) + '</div>'
            : '') +
        '</div>' +
      '</div>';
    }).join('');
  });
}

function handleBuildPrompt(type) {
  var isSystem = type === 'system';
  var btnId    = isSystem ? 'build-system-prompt-btn' : 'build-silo-prompt-btn';
  var fn       = isSystem ? 'buildSystemPrompt' : 'buildSiloPrompt';
  var label    = isSystem ? 'System Prompt' : 'Silo Prompt';
  var btn      = document.getElementById(btnId);
  if (!btn) return;

  // Double-tap confirm
  if (btn.dataset.confirm !== 'yes') {
    btn.textContent     = 'Tap again to rebuild';
    btn.dataset.confirm = 'yes';
    setTimeout(function() {
      btn.textContent     = 'Rebuild ' + label;
      btn.dataset.confirm = '';
    }, 5000);
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Building…';
  btn.dataset.confirm = '';

  callServer(fn, [], function(res) {
    btn.disabled    = false;
    btn.textContent = 'Rebuild ' + label;

    if (!res || !res.success) {
      showDiagStatus(label + ' build failed: ' + esc((res && res.message) || 'Unknown error'));
    } else {
      showDiagStatus(label + ' rebuilt. ' +
        (res.docUrl
          ? '<a href="' + esc(res.docUrl) + '" target="_blank">Open ↗</a>'
          : ''));
      loadPromptHealth();
    }
  });
}

// ── Drip Quarantine badge ────────────────────────────────────────
// Reads the DRIP_QUARANTINE sheet row count from the queue status
// response and renders a badge in the Diagnostics health row.
// Wire-up: call renderQuarantineBadge(count) from loadDiagnostics()
// or after loadQueueStatus() resolves if quarantine_count is
// included in the getQueueStatus() response.

function renderQuarantineBadge(count) {
  var el = document.getElementById('quarantine-badge');
  if (!el) return;
  count = parseInt(count) || 0;
  if (count > 0) {
    el.className   = 'quarantine-badge';
    el.textContent = '⚠ ' + count + ' drip(s) quarantined';
  } else {
    el.className   = 'quarantine-badge clean';
    el.textContent = '✓ Drip quarantine clear';
  }
}

</script>
