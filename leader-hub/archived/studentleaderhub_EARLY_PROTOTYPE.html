<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaderHub — CHHS CTE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --bg:#f7f6f2;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e2e0d6;
  --border2:#cccac0;
  --text:#1a1a18;
  --text2:#5a5955;
  --text3:#9b9890;
  --red:#c53030;--red-bg:#fff5f5;--red-border:#feb2b2;
  --amber:#92600a;--amber-bg:#fffbeb;--amber-border:#f6c142;
  --green:#276749;--green-bg:#f0fff4;--green-border:#9ae6b4;
  --blue:#1a56a3;--blue-bg:#ebf4ff;--blue-border:#90cdf4;
  --purple:#5b41c5;--purple-bg:#f3efff;--purple-border:#b794f4;
  --teal:#0c7a6e;--teal-bg:#e6fffa;--teal-border:#81e6d9;
  --dsp-end:2026-05-15;
  --radius:8px;--radius-lg:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

/* ─── TOP NAV ─── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 12px;
  height:52px;
  gap:2px;
}
#topbar .logo{
  font-family:var(--mono);font-weight:500;font-size:13px;
  color:var(--text2);margin-right:8px;white-space:nowrap;
  flex-shrink:0;
}
#topbar .logo span{color:var(--blue);font-weight:500}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
  border:none;background:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--text2);
  padding:6px 10px;border-radius:6px;
  white-space:nowrap;
  transition:background .12s,color .12s;
}
.nav-tab:hover{background:var(--surface2);color:var(--text)}
.nav-tab.active{background:var(--blue-bg);color:var(--blue)}
#dsp-badge{
  flex-shrink:0;
  font-family:var(--mono);font-size:11px;font-weight:500;
  background:var(--red-bg);color:var(--red);
  border:1px solid var(--red-border);
  padding:3px 8px;border-radius:20px;
  margin-left:8px;
  white-space:nowrap;
}

/* ─── MAIN CONTENT ─── */
#main{margin-top:52px;min-height:calc(100vh - 52px)}
.view{display:none;padding:16px;max-width:900px;margin:0 auto}
.view.active{display:block}

/* ─── CARDS ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:10px}

/* ─── GRID LAYOUTS ─── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.grid-2,.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr}}

/* ─── BUTTONS ─── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font);font-size:13px;font-weight:500;
  padding:7px 13px;border-radius:var(--radius);
  cursor:pointer;border:1px solid var(--border2);
  background:var(--surface);color:var(--text);
  transition:background .12s,border-color .12s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface2);border-color:var(--text3)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#1448a3;border-color:#1448a3}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-danger:hover{background:#fed7d7}
.btn-success{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-xs{padding:2px 7px;font-size:11px;border-radius:5px}

/* ─── FORMS ─── */
input[type=text],input[type=date],input[type=number],textarea,select{
  font-family:var(--font);font-size:13px;
  border:1px solid var(--border2);border-radius:var(--radius);
  padding:7px 10px;background:var(--surface);color:var(--text);
  width:100%;outline:none;
  transition:border-color .12s;
}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,textarea:focus,select:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,163,.1);
}
textarea{resize:vertical;min-height:80px}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.form-row-inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

/* ─── BADGES / TAGS ─── */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.03em}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.badge-teal{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* ─── PRIORITY / NEXT ACTION ─── */
#na-card{
  background:linear-gradient(135deg,var(--blue-bg) 0%,#e8f0fe 100%);
  border:1.5px solid var(--blue);
  border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;
}
#na-eyebrow{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
#na-text{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.3}
#na-meta{display:flex;gap:6px;flex-wrap:wrap}

/* ─── ROLE TILES ─── */
.role-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
@media(max-width:550px){.role-grid{grid-template-columns:repeat(3,1fr)}}
.role-tile{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:10px 8px;
  text-align:center;cursor:pointer;
  transition:border-color .12s,transform .1s,box-shadow .12s;
  position:relative;
}
.role-tile:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.role-tile .role-icon{font-size:22px;margin-bottom:4px}
.role-tile .role-name{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.role-tile .role-status{font-size:10px;color:var(--text3)}
.role-alert{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.role-alert.red{background:var(--red)}
.role-alert.amber{background:var(--amber)}

/* ─── RING PROGRESS ─── */
.ring-wrap{margin:0 auto;width:40px;height:40px}

/* ─── SCHEDULE STRIP ─── */
.period-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:var(--radius);
  margin-bottom:4px;
  border:1px solid var(--border);background:var(--surface);
}
.period-row.now{background:var(--amber-bg);border-color:var(--amber-border)}
.period-row.done{opacity:.55}
.period-name{font-size:12px;font-weight:500;flex:1}
.period-time{font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap}
.period-course{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:auto}

/* ─── DEADLINE LIST ─── */
.dl-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--border);
}
.dl-row:last-child{border-bottom:none}
.dl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dl-info{flex:1;min-width:0}
.dl-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-sub{font-size:11px;color:var(--text2)}
.dl-days{font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap;margin-left:auto}
.dl-row.done .dl-title{text-decoration:line-through;color:var(--text3)}

/* ─── TASK ROWS ─── */
.task-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 12px;border-bottom:1px solid var(--border);
}
.task-row:last-child{border-bottom:none}
.task-check{
  width:16px;height:16px;border-radius:4px;
  border:1.5px solid var(--border2);background:var(--surface);
  cursor:pointer;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,border-color .1s;
}
.task-check.checked{background:var(--green);border-color:var(--green);color:#fff;font-size:9px}
.task-body{flex:1;min-width:0}
.task-text{font-size:13px;font-weight:500}
.task-row.done .task-text{text-decoration:line-through;color:var(--text3)}
.task-actions{display:flex;gap:4px;flex-shrink:0}

/* ─── LESSON CARDS ─── */
.lesson-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:6px;
  overflow:hidden;
}
.lesson-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:pointer;
  transition:background .1s;
}
.lesson-header:hover{background:var(--surface2)}
.lesson-type-badge{font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;flex-shrink:0}
.lesson-title{font-size:13px;font-weight:500;flex:1}
.lesson-detail{
  padding:12px 14px;
  border-top:1px solid var(--border);
  background:var(--surface2);
  display:none;
}
.lesson-detail.open{display:block}
.canvas-name{
  font-family:var(--mono);font-size:11px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:5px;padding:6px 10px;
  color:var(--text2);margin-bottom:8px;
  word-break:break-all;
  cursor:pointer;
}
.canvas-name:hover{border-color:var(--blue);color:var(--blue)}

/* ─── SCR TABLE ─── */
.scr-container{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg)}
.scr-table{border-collapse:collapse;min-width:100%}
.scr-table th,.scr-table td{border:1px solid var(--border);padding:0}
.scr-table th{background:var(--surface2);font-size:11px;font-weight:600;color:var(--text2);padding:6px 8px;white-space:nowrap;position:sticky;top:0;z-index:2}
.scr-name-col{min-width:130px;max-width:150px;position:sticky;left:0;z-index:3;background:var(--surface2) !important}
.scr-table td.scr-name-cell{position:sticky;left:0;z-index:2;background:var(--surface);padding:5px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.scr-score-cell{
  width:34px;min-width:34px;height:32px;
  text-align:center;cursor:pointer;
  font-family:var(--mono);font-size:12px;font-weight:500;
  transition:background .1s;
}
.scr-score-cell:hover{background:var(--blue-bg) !important}
.score-1{background:#c6f6d5;color:#22543d}
.score-2{background:#e9f7c8;color:#2d6a0a}
.score-3{background:#fefcbf;color:#744210}
.score-4{background:#feebc8;color:#7b341e}
.score-5{background:#fed7d7;color:#742a2a}
.area-header-row th{background:#e8e6dc !important;font-size:10px;text-align:left;padding:4px 8px;color:var(--text2)}

/* ─── JOURNAL ─── */
.mood-row{display:flex;gap:8px;margin-bottom:10px}
.mood-btn{
  flex:1;padding:8px 4px;border:1.5px solid var(--border);
  border-radius:var(--radius);background:var(--surface);
  cursor:pointer;text-align:center;font-size:18px;
  transition:border-color .12s,background .12s;
}
.mood-btn.selected{border-color:var(--blue);background:var(--blue-bg)}
.energy-row{display:flex;gap:6px;margin-bottom:10px}
.energy-btn{
  flex:1;padding:6px;border:1.5px solid var(--border);
  border-radius:var(--radius);background:var(--surface);
  cursor:pointer;text-align:center;font-size:13px;font-weight:600;
  transition:border-color .12s,background .12s;
}
.energy-btn.selected{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}

/* ─── TRIP WIZARD ─── */
.wizard-step{display:none}.wizard-step.active{display:block}
.wizard-nav{display:flex;gap:8px;margin-bottom:16px}
.wizard-dot{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;cursor:pointer;
  border:2px solid var(--border2);color:var(--text2);
  transition:all .15s;
}
.wizard-dot.active{border-color:var(--blue);background:var(--blue);color:#fff}
.wizard-dot.done{border-color:var(--green);background:var(--green);color:#fff}
.approval-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:6px;
  background:var(--surface);
}
.approval-role{font-size:13px;font-weight:500;flex:1}
.approval-status{font-size:12px;padding:3px 8px;border-radius:5px;cursor:pointer;border:none;font-family:var(--font);font-weight:500}
.approval-pending{background:var(--amber-bg);color:var(--amber)}
.approval-approved{background:var(--green-bg);color:var(--green)}

/* ─── BRAG BOARD ─── */
.audience-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.audience-tab{
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border2);background:var(--surface);color:var(--text2);
  transition:all .12s;
}
.audience-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.brag-content{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  font-size:13px;line-height:1.7;
  min-height:200px;white-space:pre-wrap;
}

/* ─── TOAST ─── */
#toast-container{
  position:fixed;bottom:20px;right:20px;z-index:999;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  background:var(--text);color:#fff;
  padding:10px 16px;border-radius:var(--radius);
  font-size:13px;max-width:320px;
  animation:toastIn .2s ease;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.warning{background:var(--amber)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ─── MODAL ─── */
#modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.4);
  align-items:center;justify-content:center;
  padding:16px;
}
#modal-overlay.open{display:flex}
#modal-box{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:20px;max-width:480px;width:100%;
  max-height:80vh;overflow-y:auto;
}
.modal-title{font-size:16px;font-weight:600;margin-bottom:14px}

/* ─── STAT CARDS ─── */
.stat-card{
  background:var(--surface2);border-radius:var(--radius);
  padding:12px;text-align:center;
}
.stat-val{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text2)}

/* ─── SECTION HEADER ─── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}

/* ─── MISC ─── */
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.text-muted{color:var(--text2);font-size:12px}
.text-small{font-size:12px}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{display:flex;flex-wrap:wrap;gap:6px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mb-8{margin-bottom:8px}
.w-full{width:100%}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">Leader<span>Hub</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showView('dashboard')">🏠 Dashboard</button>
    <button class="nav-tab" onclick="showView('tasks')">✅ Tasks</button>
    <button class="nav-tab" onclick="showView('lessons')">📚 Lessons</button>
    <button class="nav-tab" onclick="showView('scr')">📊 SCR</button>
    <button class="nav-tab" onclick="showView('trips')">🚌 Trips</button>
    <button class="nav-tab" onclick="showView('journal')">✏️ Journal</button>
    <button class="nav-tab" onclick="showView('brag')">🏆 Brag Board</button>
    <button class="nav-tab" onclick="showView('settings')">⚙️ Settings</button>
  </div>
  <div id="dsp-badge">— days to DSP</div>
</div>

<div id="main">
  <div class="view active" id="view-dashboard"><div class="spinner">Loading…</div></div>
  <div class="view" id="view-tasks"></div>
  <div class="view" id="view-lessons"></div>
  <div class="view" id="view-scr"></div>
  <div class="view" id="view-trips"></div>
  <div class="view" id="view-journal"></div>
  <div class="view" id="view-brag"></div>
  <div class="view" id="view-settings"></div>
</div>

<div id="toast-container"></div>
<div id="modal-overlay" onclick="closeModal(event)"><div id="modal-box"></div></div>

<script>
'use strict';
// ════════════════════════════════════════════
// LOCAL STORAGE HELPERS
// ════════════════════════════════════════════
const LS={
  get(k){try{return JSON.parse(localStorage.getItem('lh_'+k))}catch(e){return null}},
  set(k,v){localStorage.setItem('lh_'+k,JSON.stringify(v))},
  del(k){localStorage.removeItem('lh_'+k)}
};

// ════════════════════════════════════════════
// BELL SCHEDULE — A/B Day block schedule
// ════════════════════════════════════════════
const BELL={
  A:[
    {slot:1,name:'Block 1',start:'07:20',end:'08:50',course:null,label:'Planning'},
    {slot:2,name:'Block 2',start:'08:54',end:'10:24',course:null,label:'Planning'},
    {slot:'lunch',name:'Lunch',start:'10:24',end:'11:10',course:null,label:''},
    {slot:3,name:'Block 3',start:'11:14',end:'12:44',course:'8177',label:'8177'},
    {slot:4,name:'Block 4',start:'12:48',end:'14:18',course:'6115',label:'6115'}
  ],
  B:[
    {slot:1,name:'Block 1',start:'07:20',end:'08:50',course:null,label:'Planning'},
    {slot:2,name:'Block 2',start:'08:54',end:'10:24',course:'8175',label:'8175 §1'},
    {slot:3,name:'Block 3',start:'10:28',end:'11:58',course:'8175',label:'8175 §2'},
    {slot:'lunch',name:'Lunch',start:'11:58',end:'12:43',course:null,label:''},
    {slot:4,name:'Block 4',start:'12:47',end:'14:17',course:'8175',label:'8175 §3'}
  ],
  E:[  // Early release
    {slot:1,name:'Block 1',start:'07:20',end:'08:20',course:null,label:'Planning'},
    {slot:2,name:'Block 2',start:'08:24',end:'09:24',course:'8177',label:'8177'},
    {slot:3,name:'Block 3',start:'09:28',end:'10:28',course:'6115',label:'6115'},
    {slot:4,name:'Block 4',start:'10:32',end:'11:32',course:null,label:''}
  ]
};

// ════════════════════════════════════════════
// CCPS NO-SCHOOL DATES (remaining SY 2025-26)
// ════════════════════════════════════════════
const NO_SCHOOL=new Set([
  '2026-04-07','2026-04-08','2026-04-09','2026-04-10', // spring break

// UTILITIES
// ════════════════════════════════════════════
function today(){return new Date().toISOString().slice(0,10)}
function daysUntil(d){
  const diff=new Date(d+'T00:00:00')-new Date(new Date().toDateString());
  return Math.ceil(diff/(1000*60*60*24));
}
function fmtDate(d){
  return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'});
}
function isSchoolDay(d){
  const dt=new Date(d+'T12:00:00');
  if(dt.getDay()===0||dt.getDay()===6) return false;
  return !NO_SCHOOL.has(d);
}
function urgencyClass(days){
  if(days<0) return 'red';
  if(days<=3) return 'red';
  if(days<=7) return 'amber';
  return 'blue';
}
function typeColor(type){
  const m={TEACH:'badge-blue',DUE:'badge-amber',ASSESS:'badge-red',PRESENT:'badge-purple',REVIEW:'badge-gray',INTRO:'badge-teal'};
  return m[type]||'badge-gray';
}
function copyText(text){
  navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard','success')).catch(()=>showToast('Could not copy'));
}
function showToast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(),3200);
}
function openModal(html){
  document.getElementById('modal-box').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}
function el(id){return document.getElementById(id)}
function setHTML(id,html){const e=el(id);if(e)e.innerHTML=html}

// ════════════════════════════════════════════
// SCHEDULE HELPERS
// ════════════════════════════════════════════
function getDayType(){
  const override=LS.get('schedule_override');
  if(override&&override.date===today()) return override.type;
  // Simple A/B alternation from a known reference date
  // April 14, 2026 = A day (reference)
  const ref=new Date('2026-04-14');
  const now=new Date(new Date().toDateString());
  let diff=0;
  const d=new Date(ref);
  while(d<now){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6&&!NO_SCHOOL.has(d.toISOString().slice(0,10)))diff++;}
  while(d>now){d.setDate(d.getDate()-1);if(d.getDay()!==0&&d.getDay()!==6&&!NO_SCHOOL.has(d.toISOString().slice(0,10)))diff--;}
  return diff%2===0?'A':'B';
}
function getCurrentPeriod(type){
  const sched=BELL[type]||BELL.A;
  const now=new Date();
  const hm=now.getHours()*60+now.getMinutes();
  for(const p of sched){
    const[sh,sm]=p.start.split(':').map(Number);
    const[eh,em]=p.end.split(':').map(Number);
    if(hm>=sh*60+sm&&hm<eh*60+em) return p;
  }
  return null;
}

// ════════════════════════════════════════════
// PRIORITY ENGINE
// ════════════════════════════════════════════
function buildNextAction(){
  const deadlines=LS.get('deadlines')||[];
  const tasks=(LS.get('tasks')||[]).filter(t=>!t.done);
  const journalToday=LS.get('journal_'+today());
  const synUpdate=LS.get('synergy_last_update');
  const scrUpdate=LS.get('scr_last_update');
  const queue=[];
  const td=today();

  // P100 — overdue deadlines (non-green, non-plc, non-dsp-info)
  deadlines.filter(d=>!d.done&&daysUntil(d.date)<0&&!['dl_green','dl_plc','dsp'].includes(d.type)).forEach(d=>{
    queue.push({priority:100,text:`OVERDUE: ${d.title}`,sub:fmtDate(d.date),badge:'badge-red',badgeText:'Overdue',nav:'tasks'});
  });
  // P90 — Green meeting today
  const greenToday=deadlines.find(d=>!d.done&&d.type==='dl_green'&&d.date===td);
  if(greenToday) queue.push({priority:90,text:'Green check-in meeting TODAY — have your evidence ready',badge:'badge-purple',badgeText:'Meeting Today',nav:'brag'});
  // P85 — PLC today
  const plcToday=deadlines.find(d=>!d.done&&d.type==='dl_plc'&&d.date===td);
  if(plcToday) queue.push({priority:85,text:'CTE PLC meeting today',badge:'badge-teal',badgeText:'Meeting Today',nav:'tasks'});
  // P80 — Synergy staleness >14d
  if(synUpdate){
    const staleDays=daysUntil(synUpdate)*-1;
    if(staleDays>14) queue.push({priority:80,text:`Synergy grades are ${staleDays} days stale — update needed`,badge:'badge-amber',badgeText:'Standard 1',nav:'lessons'});
  } else {
    queue.push({priority:80,text:'Log your Synergy grade update date in Lesson Plans',badge:'badge-amber',badgeText:'Standard 1',nav:'lessons'});
  }
  // P75 — SCR not updated >14d
  if(scrUpdate){
    const staleSCR=Math.ceil((new Date()-new Date(scrUpdate))/(1000*60*60*24));
    if(staleSCR>14) queue.push({priority:75,text:`SCR last updated ${staleSCR} days ago — CCPS requires ≤14 days`,badge:'badge-amber',badgeText:'SCR',nav:'scr'});
  } else {
    queue.push({priority:75,text:'No SCR update logged yet — open the SCR tracker',badge:'badge-amber',badgeText:'SCR',nav:'scr'});
  }
  // P70 — deadlines ≤3d
  deadlines.filter(d=>!d.done&&daysUntil(d.date)>=0&&daysUntil(d.date)<=3).forEach(d=>{
    queue.push({priority:70,text:`${d.title} is due ${daysUntil(d.date)===0?'TODAY':daysUntil(d.date)+'d away'}`,badge:'badge-red',badgeText:'Due Soon',nav:'tasks'});
  });
  // P60 — deadlines ≤7d
  deadlines.filter(d=>!d.done&&daysUntil(d.date)>3&&daysUntil(d.date)<=7).forEach(d=>{
    queue.push({priority:60,text:`${d.title} due in ${daysUntil(d.date)} days`,badge:'badge-amber',badgeText:'This Week',nav:'tasks'});
  });
  // P50 — open tasks
  if(tasks.length>0) queue.push({priority:50,text:`${tasks.length} open task${tasks.length===1?'':'s'} in your queue`,badge:'badge-blue',badgeText:'Tasks',nav:'tasks'});
  // P30 — journal not done
  if(!journalToday&&isSchoolDay(td)) queue.push({priority:30,text:'Journal not completed for today',badge:'badge-gray',badgeText:'Reflection',nav:'journal'});
  // P0 — all clear
  queue.push({priority:0,text:'All caught up — great work!',badge:'badge-green',badgeText:'All Clear',nav:'dashboard'});

  queue.sort((a,b)=>b.priority-a.priority);
  return queue[0];
}

let currentView='dashboard';
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  el('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>{
    if(t.getAttribute('onclick')===`showView('${name}')`) t.classList.add('active');
  });
  currentView=name;
  const renders={dashboard:renderDashboard,tasks:renderTasks,lessons:renderLessons,scr:renderSCR,trips:renderTrips,journal:renderJournal,brag:renderBragBoard,settings:renderSettings};
  if(renders[name]) renders[name]();
}

function buildRoleTiles(){
  const tasks=(LS.get('tasks')||[]).filter(t=>!t.done).length;
  const deadlines=LS.get('deadlines')||[];
  const trips=LS.get('trips')||[];
  const scrDays=LS.get('scr_last_update')?Math.ceil((new Date()-new Date(LS.get('scr_last_update')))/(1000*60*60*24)):999;
  const decaTrip=deadlines.find(d=>d.type==='deca'&&!d.done);
  const tripDL=deadlines.find(d=>d.type==='trip'&&!d.done);

  const roles=[
    {icon:'📚',name:'CTE Teacher',
     alert:scrDays>14?'red':'',
     status:scrDays>14?`SCR ${scrDays}d stale`:'SCR current',
     ring:Math.min(100,Math.max(0,100-Math.round((scrDays/14)*30))),
     nav:'lessons',color:'blue'},
    {icon:'🏪',name:'School Store',
     alert:'',status:'SBE tracker',ring:65,nav:'tasks',color:'amber'},
    {icon:'🏆',name:'DECA',
     alert:decaTrip&&daysUntil(decaTrip.date)<=7?'amber':'',
     status:decaTrip?`ICDC in ${daysUntil(decaTrip.date)}d`:'Chapter active',
     ring:85,nav:'tasks',color:'purple'},
    {icon:'🎮',name:'E-Sports',
     alert:'',status:'Rosters active',ring:60,nav:'tasks',color:'teal'},
    {icon:'🚌',name:'Field Trip',
     alert:tripDL&&daysUntil(tripDL.date)<=7?'red':'',
     status:tripDL?`Form due in ${daysUntil(tripDL.date)}d`:'Wizard ready',
     ring:trips.length?70:30,nav:'trips',color:'green'},
  ];

  return roles.map(r=>{
    const alert=r.alert?`<div class="role-alert ${r.alert}">!</div>`:'';
    const circ=2*Math.PI*16;
    const used=circ*(1-r.ring/100);
    return `<div class="role-tile" onclick="showView('${r.nav}')">
      ${alert}
      <div class="role-icon">${r.icon}</div>
      <div class="role-name">${r.name}</div>
      <svg width="40" height="40" viewBox="0 0 40 40" style="margin:0 auto 4px;display:block">
        <circle cx="20" cy="20" r="16" fill="none" stroke="var(--border)" stroke-width="3"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="var(--${r.color})" stroke-width="3"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${used.toFixed(1)}"
          stroke-linecap="round" transform="rotate(-90 20 20)"/>
        <text x="20" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text2)">${r.ring}%</text>
      </svg>
      <div class="role-status">${r.status}</div>
    </div>`;
  }).join('');
}

  }).join('');

  const taskHTML=(items,isDone)=>items.map(t=>`<div class="task-row${t.done?' done':''}">
    <div class="task-check${t.done?' checked':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>
    <div class="task-body"><div class="task-text">${t.text}</div>${t.due?`<div class="text-muted">${fmtDate(t.due)}</div>`:''}</div>
    <div class="task-actions"><button class="btn btn-xs btn-danger" onclick="deleteTask('${t.id}')">✕</button></div>
  </div>`).join('');

  el('view-tasks').innerHTML=`
    <div class="section-header"><span class="section-title">Deadlines</span></div>
    <div class="card" style="padding:0;overflow:hidden">${dlHTML||'<div style="padding:16px;color:var(--text2)">No deadlines</div>'}</div>

    <div class="section-header mt-12">
      <span class="section-title">Tasks (${open.length} open)</span>
      <button class="btn btn-sm btn-primary" onclick="showAddTask()">+ Add Task</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden" id="task-list">
      ${open.length?taskHTML(open):'<div style="padding:16px;color:var(--text2)">No open tasks — add one above</div>'}
    </div>
    ${done.length?`<details style="margin-top:8px"><summary class="text-muted" style="cursor:pointer;padding:6px 0">Completed tasks (${done.length})</summary><div class="card" style="padding:0;overflow:hidden;margin-top:6px">${taskHTML(done)}</div></details>`:''}
  `;
}

function showAddTask(){
  openModal(`<div class="modal-title">Add Task</div>
    <div class="form-row"><label>Task</label><input type="text" id="new-task-text" placeholder="What needs to get done?" autofocus></div>
    <div class="form-row"><label>Due date (optional)</label><input type="date" id="new-task-date"></div>
    <div class="flex" style="gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="saveTask()">Add Task</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>`);
  setTimeout(()=>el('new-task-text')&&el('new-task-text').focus(),100);
}

function saveTask(){
  const text=el('new-task-text').value.trim();
  if(!text){showToast('Enter a task description','error');return;}
  const tasks=LS.get('tasks')||[];
  tasks.push({id:'t'+Date.now(),text,due:el('new-task-date').value||null,done:false,created:today()});
  LS.set('tasks',tasks);
  closeModal();
  renderTasks();
  showToast('Task added','success');
}

function toggleTask(id){
  const tasks=LS.get('tasks')||[];
  const t=tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;t.doneDate=t.done?today():null;}
  LS.set('tasks',tasks);
  renderTasks();
  if(currentView==='dashboard') renderDashboard();
}

function deleteTask(id){
  const tasks=(LS.get('tasks')||[]).filter(x=>x.id!==id);
  LS.set('tasks',tasks);
  renderTasks();
}

function toggleDeadline(id){
  const dls=LS.get('deadlines')||[];
  const d=dls.find(x=>x.id===id);
  if(d){d.done=!d.done;if(d.done){d.doneDate=today();showToast(`✓ "${d.title}" marked done`,'success');} }
  LS.set('deadlines',dls);
  renderTasks();
  if(currentView==='dashboard') renderDashboard();
}

// VIEW: LESSON PLANS
// ════════════════════════════════════════════
let lpFilter={course:'',quarter:'Q4',active:true};
function renderLessons(){
  const synUpdate=LS.get('synergy_last_update');
  const synDays=synUpdate?Math.ceil((new Date()-new Date(synUpdate))/(1000*60*60*24)):null;

  let lessons=LESSONS;
  if(lpFilter.course) lessons=lessons.filter(l=>l.course===lpFilter.course);
  if(lpFilter.quarter) lessons=lessons.filter(l=>l.q===lpFilter.quarter);
  if(lpFilter.active) lessons=lessons.filter(l=>l.active);

  const meta=LS.get('lp_meta')||{};
  const delivered=LS.get('lp_delivered')||{};

  const lessonHTML=lessons.map(l=>{
    const m=meta[l.id]||{};
    const isDelivered=!!delivered[l.id];
    const canvasStr=l.canvas||(l.course+' | '+l.q+' | '+l.type+' | '+l.title);
    return `<div class="lesson-card">
      <div class="lesson-header" onclick="toggleLesson('${l.id}')">
        <span class="lesson-type-badge ${typeColor(l.type)}">${l.type}</span>
        <span class="lesson-title">${l.title}</span>
        ${l.summative?`<span class="badge badge-amber">${l.pct}% Summative</span>`:''}
        ${isDelivered?'<span class="badge badge-green">Delivered</span>':''}
        <span style="color:var(--text3);font-size:12px">▾</span>
      </div>
      <div class="lesson-detail" id="lp-detail-${l.id}">
        <div class="form-row"><label>Canvas title (click to copy)</label>
          <div class="canvas-name" onclick="copyText('${canvasStr.replace(/'/g,"\\'")}')">📋 ${canvasStr}</div>
        </div>
        ${l.summative?`<div style="margin-bottom:8px;font-size:12px;color:var(--text2)">Synergy: <strong>${l.type==='ASSESS'?'Tests & Quizzes':l.type==='PRESENT'?'Major Assignments':'Major Assignments'}</strong> · ${l.pct}% of quarter</div>`:''}
        <div class="form-row"><label>Notes (saved as DSP evidence)</label>
          <textarea id="lp-notes-${l.id}" placeholder="Lesson notes, observations, differentiation strategies…">${m.notes||''}</textarea>
        </div>
        <div class="flex" style="gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-primary" onclick="saveLPNotes('${l.id}')">Save Notes</button>
          <button class="btn btn-sm ${isDelivered?'btn-success':''}" onclick="toggleDelivered('${l.id}')">
            ${isDelivered?'✓ Delivered':'Mark Delivered'}
          </button>
          ${m.lastSaved?`<span class="text-muted">Saved ${m.lastSaved}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  el('view-lessons').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <div class="flex-wrap" style="flex:1">
        ${['','8177','8175','6115'].map(c=>`<button class="btn btn-sm${lpFilter.course===c?' btn-primary':''}" onclick="lpFilter.course='${c}';renderLessons()">${c||'All Courses'}</button>`).join('')}
        ${['Q1','Q2','Q3','Q4',''].map(q=>`<button class="btn btn-sm${lpFilter.quarter===q?' btn-primary':''}" onclick="lpFilter.quarter='${q}';renderLessons()">${q||'All Qtr'}</button>`).join('')}
        <button class="btn btn-sm${lpFilter.active?' btn-primary':''}" onclick="lpFilter.active=!lpFilter.active;renderLessons()">${lpFilter.active?'Q4 Active':'All Lessons'}</button>
      </div>
    </div>

    <div class="card" style="padding:12px;margin-bottom:12px;background:${synDays&&synDays>14?'var(--amber-bg)':'var(--green-bg)'};border-color:${synDays&&synDays>14?'var(--amber-border)':'var(--green-border)'}">
      <div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--text2)">Synergy Grade Update</div>
          <div style="font-size:13px">${synUpdate?`Last updated: ${fmtDate(synUpdate)} (${synDays} days ago)`:'Not yet logged this quarter'}</div>
        </div>
        <button class="btn btn-sm" onclick="logSynergyUpdate()">Mark Updated Today</button>
      </div>
    </div>

    <div style="font-size:12px;color:var(--text2);margin-bottom:8px">${lessons.length} lesson${lessons.length===1?'':'s'}</div>
    ${lessonHTML||'<div class="card text-muted">No lessons match filters</div>'}
  `;
}

function toggleLesson(id){
  const d=el('lp-detail-'+id);
  if(d) d.classList.toggle('open');
}

function saveLPNotes(id){
  const notes=el('lp-notes-'+id).value;
  const meta=LS.get('lp_meta')||{};
  meta[id]={notes,lastSaved:today(),evidence:true};
  LS.set('lp_meta',meta);
  showToast('Notes saved (DSP evidence logged)','success');
}

function toggleDelivered(id){
  const delivered=LS.get('lp_delivered')||{};
  if(delivered[id]) delete delivered[id];
  else delivered[id]={date:today()};
  LS.set('lp_delivered',delivered);
  renderLessons();
}

function logSynergyUpdate(){
  LS.set('synergy_last_update',today());
  showToast('Synergy update logged for today','success');
  renderLessons();
  if(currentView==='dashboard') renderDashboard();
}

// VIEW: SCR TRACKER
// ════════════════════════════════════════════
let scrCourse='8177';
let scrAreaFilter='';
function renderSCR(){
  const courses=['8177','8175','6115'];
  const courseNames={'8177':'SEEM 8177','8175':'SEM 8175','6115':'PBM 6115'};
  const scrUpdate=LS.get('scr_last_update');
  const scrDays=scrUpdate?Math.ceil((new Date()-new Date(scrUpdate))/(1000*60*60*24)):null;
  const comps=COMPETENCIES[scrCourse]||[];
  const areas=[...new Set(comps.map(c=>c.area))];
  const filteredComps=scrAreaFilter?comps.filter(c=>c.area===scrAreaFilter):comps;
  const students=LS.get('scr_students_'+scrCourse)||[];
  const scores=LS.get('scr_scores_'+scrCourse)||{};

  // Stats
  const totalCells=students.length*filteredComps.length;
  const scoredCells=students.reduce((acc,s)=>acc+filteredComps.filter(c=>(scores[s.id]||{})[c.n]).length,0);
  const pct=totalCells?Math.round(scoredCells/totalCells*100):0;

  const areaHTML=`<option value="">All Duty Areas (${comps.length})</option>`+
    areas.map(a=>`<option value="${a.replace(/"/g,'&quot;')}"${scrAreaFilter===a?' selected':''}>${a} (${comps.filter(c=>c.area===a).length})</option>`).join('');

  // Build table headers
  const compHeaders=filteredComps.map(c=>`<th title="${c.text.replace(/"/g,'&quot;')}" style="min-width:34px;max-width:34px;width:34px;font-size:10px;text-align:center;cursor:help">${c.n}</th>`).join('');

  // Group headers for areas
  let prevArea='';
  const rows=[];
  if(!scrAreaFilter){
    const areaGroups={};
    filteredComps.forEach(c=>{if(!areaGroups[c.area])areaGroups[c.area]=[];areaGroups[c.area].push(c);});
    // We'll add area separator rows
  }

  // Build student rows
  const studentRows=students.map(s=>{
    const sScores=scores[s.id]||{};
    const cells=filteredComps.map(c=>{
      const v=sScores[c.n]||'';
      return `<td class="scr-score-cell${v?' score-'+v:''}" onclick="scrSetScore('${s.id}',${c.n})" title="C${c.n}: ${c.text.replace(/'/g,"\\'")||''}">${v||''}</td>`;
    }).join('');
    const done=filteredComps.filter(c=>sScores[c.n]).length;
    return `<tr>
      <td class="scr-name-cell">
        <div style="display:flex;align-items:center;gap:4px;justify-content:space-between">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px" title="${s.name}">${s.name}</span>
          <span style="font-size:9px;color:var(--text3);flex-shrink:0">${done}/${filteredComps.length}</span>
        </div>
      </td>
      ${cells}
    </tr>`;
  }).join('');

  el('view-scr').innerHTML=`
    <div class="flex" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
      ${courses.map(c=>`<button class="btn${scrCourse===c?' btn-primary':''}" onclick="scrCourse='${c}';scrAreaFilter='';renderSCR()">${courseNames[c]}</button>`).join('')}
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:12px;color:${scrDays===null?'var(--red)':scrDays>14?'var(--red)':'var(--green)'}">
          ${scrDays===null?'⚠ Never updated':scrDays>14?`⚠ ${scrDays}d since last update`:`✓ Updated ${scrDays}d ago`}
        </span>
        <button class="btn btn-sm btn-success" onclick="logSCRUpdate()">Log Update Today</button>
      </div>
    </div>

    <div class="card" style="padding:10px;margin-bottom:10px">
      <div class="flex" style="gap:12px;flex-wrap:wrap;justify-content:space-between">
        <div>
          <select onchange="scrAreaFilter=this.value;renderSCR()" style="max-width:320px">${areaHTML}</select>
        </div>
        <div class="flex" style="gap:8px">
          ${totalCells>0?`<span class="badge badge-${pct>80?'green':pct>50?'amber':'red'}">${pct}% scored</span>`:''}
          <button class="btn btn-sm btn-primary" onclick="scrAddStudent()">+ Add Student</button>
        </div>
      </div>
    </div>

    <div style="font-size:11px;color:var(--text2);margin-bottom:6px">
      Click any score cell to enter/edit. Scores: <span class="badge" style="background:#c6f6d5;color:#22543d;border:none">1=Can teach others</span>
      <span class="badge" style="background:#e9f7c8;color:#2d6a0a;border:none">2=Without supervision</span>
      <span class="badge" style="background:#fefcbf;color:#744210;border:none">3=Limited supervision</span>
      <span class="badge" style="background:#feebc8;color:#7b341e;border:none">4=With supervision</span>
      <span class="badge" style="background:#fed7d7;color:#742a2a;border:none">5=Cannot perform</span>
    </div>

    ${students.length===0?`<div class="card text-muted" style="padding:16px">No students added yet for ${scrCourse}. Click "+ Add Student" to get started.</div>`:
    `<div class="scr-container">
      <table class="scr-table">
        <thead>
          <tr>
            <th class="scr-name-col">Student</th>
            ${compHeaders}
          </tr>
        </thead>
        <tbody id="scr-tbody">
          ${studentRows}
        </tbody>
      </table>
    </div>`}
  `;
}

function scrAddStudent(){
  openModal(`<div class="modal-title">Add Student — ${scrCourse}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Student names are stored locally and never leave this device (FERPA-safe)</div>
    <div class="form-row"><label>Student name</label><input type="text" id="new-student-name" placeholder="First Last" autofocus></div>
    <div class="flex" style="gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="saveStudent()">Add</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>`);
  setTimeout(()=>el('new-student-name')&&el('new-student-name').focus(),100);
}

function saveStudent(){
  const name=el('new-student-name').value.trim();
  if(!name){showToast('Enter a name','error');return;}
  const students=LS.get('scr_students_'+scrCourse)||[];
  students.push({id:'s'+Date.now(),name,added:today()});
  LS.set('scr_students_'+scrCourse,students);
  closeModal();
  renderSCR();
  showToast('Student added','success');
}

function scrSetScore(studentId,compN){
  openModal(`<div class="modal-title">Score — Competency ${compN}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px">${(COMPETENCIES[scrCourse]||[]).find(c=>c.n===compN)?.text||''}</div>
    <div class="flex-wrap" style="gap:8px;margin-bottom:12px">
      ${[1,2,3,4,5].map(n=>`<button class="btn" style="flex:1;min-width:80px;background:${['#c6f6d5','#e9f7c8','#fefcbf','#feebc8','#fed7d7'][n-1]}" onclick="saveSCRScore('${studentId}',${compN},${n})">${n} — ${['Can teach others','No supervision','Limited supervision','With supervision','Cannot perform'][n-1]}</button>`).join('')}
    </div>
    <button class="btn btn-sm btn-danger" onclick="saveSCRScore('${studentId}',${compN},0)">Clear score</button>
    <button class="btn btn-sm" onclick="closeModal()" style="margin-left:8px">Cancel</button>`);
}

function saveSCRScore(studentId,compN,score){
  const scores=LS.get('scr_scores_'+scrCourse)||{};
  if(!scores[studentId]) scores[studentId]={};
  if(score===0) delete scores[studentId][compN];
  else scores[studentId][compN]=score;
  LS.set('scr_scores_'+scrCourse,scores);
  closeModal();
  renderSCR();
}

function logSCRUpdate(){
  LS.set('scr_last_update',today());
  showToast('SCR update logged for today','success');
  renderSCR();
  if(currentView==='dashboard') renderDashboard();
}

// VIEW: TRIP WIZARD
// ════════════════════════════════════════════
let tripStep=0;
let editingTrip=null;
function renderTrips(){
  const trips=LS.get('trips')||[];
  if(editingTrip!==null){renderTripForm();return;}
  el('view-trips').innerHTML=`
    <div class="section-header">
      <span class="section-title">Field Trips (${trips.length})</span>
      <button class="btn btn-sm btn-primary" onclick="startNewTrip()">+ New Trip</button>
    </div>
    ${trips.length===0?`<div class="card text-muted" style="padding:20px;text-align:center">
      <div style="font-size:24px;margin-bottom:8px">🚌</div>
      <div>No trips yet. Click "+ New Trip" to start the planning wizard.</div>
    </div>`:trips.map((t,i)=>{
      const slipsDone=t.slipsReturned||0;
      const slipsTotal=t.headcount||0;
      const approvals=t.approvals||{};
      const steps=['principal','ap','transportation'];
      const approvedCount=steps.filter(s=>approvals[s]==='approved').length;
      return `<div class="card">
        <div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:15px;font-weight:600">${t.destination}</div>
            <div class="text-muted">${t.purpose} · ${t.date?fmtDate(t.date):'Date TBD'} · ${t.headcount||0} students</div>
          </div>
          <div class="flex" style="gap:6px">
            <span class="badge ${approvedCount===3?'badge-green':approvedCount>0?'badge-amber':'badge-red'}">${approvedCount}/3 approved</span>
            <span class="badge ${slipsTotal>0&&slipsDone===slipsTotal?'badge-green':slipsDone>0?'badge-amber':'badge-gray'}">${slipsDone}/${slipsTotal} slips</span>
            <button class="btn btn-xs" onclick="editTrip(${i})">Edit</button>
            <button class="btn btn-xs btn-danger" onclick="deleteTrip(${i})">✕</button>
          </div>
        </div>
        <div style="margin-top:10px">
          <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px">Approval Chain</div>
          ${['principal','ap','transportation'].map(role=>{
            const status=approvals[role]||'pending';
            const labels={'principal':'Principal','ap':'Assistant Principal','transportation':'Transportation'};
            return `<div class="approval-row">
              <span class="approval-role">${labels[role]}</span>
              <button class="approval-status approval-${status}" onclick="cycleApproval(${i},'${role}')">${status==='approved'?'✓ Approved':'⏳ Pending'}</button>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  `;
}

function startNewTrip(){
  editingTrip={destination:'',purpose:'',date:'',headcount:0,grades:'',chaperoneRatio:'',approvals:{},slipsSent:0,slipsReturned:0,notes:''};
  tripStep=0;
  renderTripForm();
}

function editTrip(i){
  editingTrip=JSON.parse(JSON.stringify((LS.get('trips')||[])[i]));
  editingTrip._editIndex=i;
  tripStep=0;
  renderTripForm();
}

function deleteTrip(i){
  if(!confirm('Delete this trip?')) return;
  const trips=LS.get('trips')||[];
  trips.splice(i,1);
  LS.set('trips',trips);
  renderTrips();
}

function cycleApproval(i,role){
  const trips=LS.get('trips')||[];
  if(!trips[i].approvals) trips[i].approvals={};
  trips[i].approvals[role]=trips[i].approvals[role]==='approved'?'pending':'approved';
  LS.set('trips',trips);
  renderTrips();
}

function renderTripForm(){
  const steps=['Basic Info','Approval Chain','Permission Slips'];
  const navDots=steps.map((s,i)=>`<div class="wizard-dot${i===tripStep?' active':i<tripStep?' done':''}" onclick="tripStep=${i};renderTripForm()">${i<tripStep?'✓':i+1}</div><span style="font-size:12px;color:var(--text2);margin-right:12px">${s}</span>`).join('');
  let formHTML='';
  if(tripStep===0){
    formHTML=`
      <div class="form-row"><label>Destination</label><input type="text" id="t-dest" value="${editingTrip.destination||''}" placeholder="Museum, venue, business…"></div>
      <div class="grid-2">
        <div class="form-row"><label>Date</label><input type="date" id="t-date" value="${editingTrip.date||''}"></div>
        <div class="form-row"><label>Student headcount</label><input type="number" id="t-head" value="${editingTrip.headcount||''}" min="1"></div>
      </div>
      <div class="form-row"><label>Educational purpose (for approval form)</label><textarea id="t-purpose" rows="2" placeholder="CCPS standard: educational alignment, curriculum connection…">${editingTrip.purpose||''}</textarea></div>
      <div class="grid-2">
        <div class="form-row"><label>Grades</label><input type="text" id="t-grades" value="${editingTrip.grades||''}" placeholder="e.g. 11th"></div>
        <div class="form-row"><label>Chaperone ratio</label><input type="text" id="t-chap" value="${editingTrip.chaperoneRatio||''}" placeholder="e.g. 1:10"></div>
      </div>`;
  } else if(tripStep===1){
    formHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Track CCPS approval chain. Click each role to toggle approved.</div>
      ${['principal','ap','transportation'].map(role=>{
        const labels={'principal':'Principal','ap':'Assistant Principal','transportation':'Transportation Dept.'};
        const status=(editingTrip.approvals||{})[role]||'pending';
        return `<div class="approval-row">
          <span class="approval-role">${labels[role]}</span>
          <button class="approval-status approval-${status}" onclick="editingTrip.approvals=editingTrip.approvals||{};editingTrip.approvals['${role}']=editingTrip.approvals['${role}']==='approved'?'pending':'approved';renderTripForm()">${status==='approved'?'✓ Approved':'⏳ Pending — click to approve'}</button>
        </div>`;
      }).join('')}
      <div class="form-row mt-12"><label>Notes</label><textarea id="t-notes" rows="2" placeholder="Any follow-up needed, contacts…">${editingTrip.notes||''}</textarea></div>`;
  } else {
    formHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Track permission slip distribution and returns.</div>
      <div class="grid-2">
        <div class="form-row"><label>Slips sent home</label><input type="number" id="t-sent" value="${editingTrip.slipsSent||0}" min="0"></div>
        <div class="form-row"><label>Slips returned</label><input type="number" id="t-returned" value="${editingTrip.slipsReturned||0}" min="0"></div>
      </div>
      ${editingTrip.headcount?`<div class="badge ${(editingTrip.slipsReturned||0)>=(editingTrip.headcount||0)?'badge-green':(editingTrip.slipsReturned||0)>0?'badge-amber':'badge-red'}" style="font-size:12px;padding:4px 10px">${editingTrip.slipsReturned||0} of ${editingTrip.headcount} returned (${Math.round(((editingTrip.slipsReturned||0)/(editingTrip.headcount||1))*100)}%)</div>`:''}
    `;
  }

  el('view-trips').innerHTML=`
    <div class="flex" style="gap:8px;align-items:center;margin-bottom:14px">
      <button class="btn btn-sm" onclick="editingTrip=null;renderTrips()">← Back</button>
      <span style="font-size:15px;font-weight:600">${editingTrip._editIndex!==undefined?'Edit Trip':'New Trip'}</span>
    </div>
    <div class="wizard-nav">${navDots}</div>
    <div class="card">
      ${formHTML}
      <div class="flex" style="gap:8px;margin-top:16px">
        ${tripStep>0?`<button class="btn" onclick="tripStep--;renderTripForm()">← Back</button>`:''}
        ${tripStep<2?`<button class="btn btn-primary" onclick="saveCurrentTripStep()">Next →</button>`:`<button class="btn btn-primary" onclick="saveTrip()">Save Trip</button>`}
        <button class="btn" onclick="editingTrip=null;renderTrips()">Cancel</button>
      </div>
    </div>`;
}

function saveCurrentTripStep(){
  if(tripStep===0){
    editingTrip.destination=el('t-dest').value.trim();
    editingTrip.date=el('t-date').value;
    editingTrip.headcount=parseInt(el('t-head').value)||0;
    editingTrip.purpose=el('t-purpose').value.trim();
    editingTrip.grades=el('t-grades').value.trim();
    editingTrip.chaperoneRatio=el('t-chap').value.trim();
    if(!editingTrip.destination){showToast('Enter a destination','error');return;}
  } else if(tripStep===1){
    editingTrip.notes=el('t-notes')?el('t-notes').value.trim():'';
  }
  tripStep++;
  renderTripForm();
}

function saveTrip(){
  editingTrip.slipsSent=parseInt(el('t-sent').value)||0;
  editingTrip.slipsReturned=parseInt(el('t-returned').value)||0;
  const trips=LS.get('trips')||[];
  if(editingTrip._editIndex!==undefined){
    const idx=editingTrip._editIndex;
    delete editingTrip._editIndex;
    trips[idx]=editingTrip;
  } else {
    delete editingTrip._editIndex;
    trips.push(editingTrip);
  }
  LS.set('trips',trips);
  editingTrip=null;
  showToast('Trip saved','success');
  renderTrips();
}

let journalMood=0;
let journalEnergy=0;
function renderJournal(){

          <span class="badge badge-${e.mood<=2?'red':e.mood<=3?'amber':'green'}">Mood ${e.mood}/5</span>
          <span class="badge badge-blue">Energy ${e.energy}/5</span>
        </div>
        ${e.win?`<div style="font-size:13px;margin-bottom:6px"><strong>Win:</strong> ${e.win}</div>`:''}
        ${e.avoided?`<div style="font-size:13px;color:var(--text2)"><strong>Avoided:</strong> ${e.avoided}</div>`:''}
        <button class="btn btn-sm btn-danger mt-8" onclick="LS.del('journal_${today()}');renderJournal()">Re-do today's entry</button>
      </div>
      ${history.length>1?`<div class="section-header mt-12"><span class="section-title">Recent Entries</span></div>${histHTML}`:''}

  const moodEmoji=['','😞','😕','😐','🙂','😄'];
  const moodHTML=[1,2,3,4,5].map(n=>`<button class="mood-btn${journalMood===n?' selected':''}" onclick="journalMood=${n};renderJournalForm()">${moodEmoji[n]}<div style="font-size:10px;margin-top:2px">${n}</div></button>`).join('');
  const energyLabels=['','Drained','Low','Medium','High','Wired'];
  const energyHTML=[1,2,3,4,5].map(n=>`<button class="energy-btn${journalEnergy===n?' selected':''}" onclick="journalEnergy=${n};renderJournalForm()">${energyLabels[n]}</button>`).join('');

  el('view-journal').innerHTML=`
    <div class="card">
      <div class="card-title">Today's Reflection — ${fmtDate(today())}</div>
      <div class="form-row">
        <label>How did today feel?</label>
        <div class="mood-row" id="mood-row">${moodHTML}</div>
      </div>
      <div class="form-row">
        <label>Energy level</label>
        <div class="energy-row" id="energy-row">${energyHTML}</div>
      </div>
      <div class="form-row">
        <label>One win from today</label>
        <input type="text" id="j-win" placeholder="Something that went well…">
      </div>

        <input type="text" id="j-avoided" placeholder="What didn't you get to?">
      </div>

    </div>

        <span class="flex" style="gap:6px">
          <span class="badge badge-${h.mood<=2?'red':h.mood<=3?'amber':'green'}">Mood ${h.mood}</span>
          <span class="badge badge-blue">Energy ${h.energy}</span>
        </span>
      </div>
      ${h.win?`<div style="font-size:12px"><strong>Win:</strong> ${h.win}</div>`:''}

function renderJournalForm(){
  const moodEmoji=['','😞','😕','😐','🙂','😄'];
  const energyLabels=['','Drained','Low','Medium','High','Wired'];
  const moodRow=el('mood-row');
  const energyRow=el('energy-row');
  if(moodRow) moodRow.innerHTML=[1,2,3,4,5].map(n=>`<button class="mood-btn${journalMood===n?' selected':''}" onclick="journalMood=${n};renderJournalForm()">${moodEmoji[n]}<div style="font-size:10px;margin-top:2px">${n}</div></button>`).join('');
  if(energyRow) energyRow.innerHTML=[1,2,3,4,5].map(n=>`<button class="energy-btn${journalEnergy===n?' selected':''}" onclick="journalEnergy=${n};renderJournalForm()">${energyLabels[n]}</button>`).join('');
}

function saveJournal(){
  if(!journalMood){showToast('Pick a mood score','error');return;}
  if(!journalEnergy){showToast('Pick an energy level','error');return;}
  const win=el('j-win').value.trim();
  const avoided=el('j-avoided').value.trim();
  const entry={date:today(),mood:journalMood,energy:journalEnergy,win,avoided,ts:Date.now()};
  LS.set('journal_'+today(),entry);
  const hist=(LS.get('journal_history')||[]).filter(h=>h.date!==today());
  hist.push(entry);
  if(hist.length>60) hist.splice(0,hist.length-60);
  LS.set('journal_history',hist);
  // Schedule cron brief for tomorrow
  if(avoided){
    LS.set('cron_pending',{entry,scheduledFor:tomorrow()});
  }
  journalMood=0;journalEnergy=0;
  showToast('Journal saved ✓','success');
  renderJournal();
  if(currentView==='dashboard') renderDashboard();
}

function tomorrow(){
  const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);
}

function checkCron(){
  const pending=LS.get('cron_pending');
  if(!pending) return;
  const now=new Date();
  const isNextDay=pending.scheduledFor&&pending.scheduledFor<=today()&&now.getHours()>=6;
  if(isNextDay&&!LS.get('cron_brief_'+today())){
    const entry=pending.entry;
    const deadlines=(LS.get('deadlines')||[]).filter(d=>!d.done&&daysUntil(d.date)<=3).map(d=>d.title);
    let msg='';
    if(entry.mood<=2) msg+='Yesterday was rough. Take it one step at a time today. ';
    else if(entry.mood>=4) msg+='Yesterday had good energy — carry that forward. ';
    if(entry.avoided) msg+=`Yesterday you pushed off: <em>"${entry.avoided}"</em>. Today's the day. `;
    if(deadlines.length) msg+=`Urgent: ${deadlines.join(', ')}.`;
    if(!msg) msg='Good morning. Check your deadlines and have a strong day.';
    const brief={date:today(),message:msg};
    LS.set('cron_brief',brief);
    LS.set('cron_brief_'+today(),true);
    LS.del('cron_pending');
  }
}

let bragAudience='green';
function renderBragBoard(){
  const gasUrl=LS.get('gas_url')||'';

function generateBragContent(audience){
  const history=(LS.get('journal_history')||[]).slice(-7);
  const tasks=(LS.get('tasks')||[]).filter(t=>t.done&&t.doneDate&&t.doneDate>=getWeekStart()).slice(-5);
  const deadlines=(LS.get('deadlines')||[]).filter(d=>d.done&&d.doneDate&&d.doneDate>=getWeekStart());
  const wins=history.filter(h=>h.win).map(h=>h.win);
  const dspDays=daysUntil('2026-05-15');

  const weekDates=`Week of ${fmtDate(getWeekStart())}`;

  if(audience==='green'){
    return `DSP Progress Update — ${weekDates}\n\nStandard 1 (Lesson Planning & Instruction):\n${LESSONS.filter(l=>l.active&&(LS.get('lp_delivered')||{})[l.id]).map(l=>`• ${l.course} | ${l.title} — delivered`).join('\n')||'• Ongoing Q4 instruction across 8177, 8175, and 6115'}\n\nStandard 2 (Professional Responsiveness):\n${wins.length?wins.map(w=>`• ${w}`).join('\n'):'• Daily communication triage completed\n• Collaborative duties maintained'}\n\nDSP Countdown: ${dspDays} days remaining until May 15\n\nUpcoming:\n${(LS.get('deadlines')||[]).filter(d=>!d.done&&daysUntil(d.date)<=14).slice(0,3).map(d=>`• ${d.title} — ${fmtDate(d.date)}`).join('\n')||'• Monitoring all deadlines'}`;
  }
  if(audience==='admin'){
    return `CTE Department Update — ${weekDates}\n\nCourse Highlights:\n${wins.length?wins.map(w=>`• ${w}`).join('\n'):'• Q4 units in progress across three course sections'}\n\nCompleted This Week:\n${[...tasks.map(t=>`• ${t.text}`),...deadlines.map(d=>`• ${d.title}`)].join('\n')||'• Ongoing instructional and administrative duties'}\n\nStudent Engagement:\nSCR documentation current. DECA chapter activities ongoing.`;
  }
  if(audience==='deca'){
    return `DECA Chapter Update — ${weekDates}\n\nWhat's Happening:\n${wins.length?wins.map(w=>`• ${w}`).join('\n'):'• Chapter members preparing for upcoming events'}\n\nUpcoming Events:\n${(LS.get('deadlines')||[]).filter(d=>d.type==='deca'&&!d.done).map(d=>`• ${d.title} — ${fmtDate(d.date)}`).join('\n')||'• Stay tuned for upcoming competitions'}\n\nReminders:\n• Permission slips and fees must be submitted on time\n• Check the chapter website for updates`;
  }
  return `Personal Log — ${weekDates}\n\nMood Trend: ${history.length?`Avg ${(history.reduce((a,h)=>a+h.mood,0)/history.length).toFixed(1)}/5`:'-'}\nEnergy Trend: ${history.length?`Avg ${(history.reduce((a,h)=>a+h.energy,0)/history.length).toFixed(1)}/5`:'-'}\n\nWins:\n${wins.length?wins.map(w=>`• ${w}`).join('\n'):'• [None logged this week]'}\n\nPushed Off (need to tackle):\n${history.filter(h=>h.avoided).map(h=>`• ${h.avoided}`).join('\n')||'• Nothing pushed off this week'}\n\nDSP: ${dspDays} days remaining`;
}

function getWeekStart(){
  const d=new Date();
  const day=d.getDay();
  d.setDate(d.getDate()-(day===0?6:day-1));
  return d.toISOString().slice(0,10);
}

function saveBragDraft(){
  const text=el('brag-text').innerText;
  LS.set('brag_draft_'+bragAudience,{text,date:today()});
  showToast('Draft saved locally','success');
}

async function sendBragToGAS(){
  const gasUrl=el('gas-url-input').value.trim();
  if(!gasUrl){showToast('Enter your GAS URL in the field above','error');return;}
  LS.set('gas_url',gasUrl);
  const text=el('brag-text').innerText;
  const title=`LeaderHub Brag Board — ${['','Ms. Green DSP Update','Admin Update','DECA Parent Update','Self Log'][['green','admin','deca','self'].indexOf(bragAudience)+1]||'Update'} — ${today()}`;
  showToast('Creating Google Doc…');
  try{
    const r=await fetch(gasUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'bragDoc',title,content:text,audience:bragAudience})});
    const data=await r.json();
    if(data.ok&&data.url){
      LS.set('last_brag_doc',{url:data.url,date:today()});
      showToast('Google Doc created!','success');
      window.open(data.url,'_blank');
      renderBragBoard();
    } else {
      showToast('GAS error: '+(data.error||'Unknown'),'error');
    }
  } catch(e){
    showToast('Could not reach GAS URL. Check the URL and try again.','error');
  }
}

const GAS_SCRIPT=`// LeaderHub EmailBridge.gs — paste in Google Apps Script
function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    if (data.action === 'bragDoc') {
      var doc = DocumentApp.create(data.title);
      var body = doc.getBody();
      body.setMarginTop(72); body.setMarginBottom(72);
      body.setMarginLeft(72); body.setMarginRight(72);
      // Title
      var title = body.appendParagraph(data.title);
      title.setHeading(DocumentApp.ParagraphHeading.HEADING1);
      body.appendHorizontalRule();
      // Content — split into sections
      var lines = data.content.split('\\n');
      lines.forEach(function(line) {
        if (line.trim() === '') { body.appendParagraph(''); return; }
        if (line.match(/^[A-Z][^:]+:$/)) {
          var h = body.appendParagraph(line);
          h.setHeading(DocumentApp.ParagraphHeading.HEADING2);
        } else {
          body.appendParagraph(line);
        }
      });
      doc.saveAndClose();
      return ContentService.createTextOutput(
        JSON.stringify({ok: true, url: doc.getUrl()})
      ).setMimeType(ContentService.MimeType.JSON);
    }
    return ContentService.createTextOutput(
      JSON.stringify({ok: false, error: 'Unknown action'})
    ).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(
      JSON.stringify({ok: false, error: err.toString()})
    ).setMimeType(ContentService.MimeType.JSON);
  }
}
function doGet(e) {
  return ContentService.createTextOutput(JSON.stringify({ok: true, msg: 'LeaderHub bridge active'}))
    .setMimeType(ContentService.MimeType.JSON);
}`;

function setScheduleOverride(type){
  LS.set('schedule_override',{type,date:today()});
  showToast(`Schedule set to ${type}-Day for today`,'success');
  renderSettings();
}

function exportData(){
  const keys=['deadlines','tasks','trips','journal_history','lp_meta','lp_delivered','synergy_last_update','scr_last_update'];
  const data={exported:today()};
  keys.forEach(k=>data[k]=LS.get(k));
  ['8177','8175','6115'].forEach(c=>{
    data['scr_students_'+c]=LS.get('scr_students_'+c);
    data['scr_scores_'+c]=LS.get('scr_scores_'+c);
  });
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='leaderhub-export-'+today()+'.json';a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported','success');
}

function clearData(){
  if(!confirm('Clear ALL LeaderHub data? This cannot be undone.')) return;
  if(!confirm('Are you absolutely sure? All tasks, journal entries, SCR data, and settings will be deleted.')) return;
  Object.keys(localStorage).filter(k=>k.startsWith('lh_')).forEach(k=>localStorage.removeItem(k));
  showToast('All data cleared','success');
  init();
}

function overrideDayType(){
  const type=prompt('Set schedule type for today: A, B, or E (early release)');
  if(type&&['A','B','E'].includes(type.toUpperCase())){
    setScheduleOverride(type.toUpperCase());
    renderDashboard();
  }
}

function seedData(){
  if(LS.get('initialized')) return;
  LS.set('deadlines',SEED_DEADLINES);
  LS.set('tasks',[]);
  LS.set('trips',[]);
  LS.set('initialized',true);
}

function updateDSPBadge(){
  const days=daysUntil('2026-05-15');
  const badge=el('dsp-badge');
  if(badge){
    badge.textContent=days+' days to DSP';
    badge.style.background=days<=14?'var(--red-bg)':days<=30?'var(--amber-bg)':'var(--blue-bg)';
    badge.style.color=days<=14?'var(--red)':days<=30?'var(--amber)':'var(--blue)';
    badge.style.borderColor=days<=14?'var(--red-border)':days<=30?'var(--amber-border)':'var(--blue-border)';
  }
}

function init(){
  seedData();
  checkCron();
  updateDSPBadge();
  renderDashboard();
  // Refresh every 60s
  setInterval(()=>{
    updateDSPBadge();
    checkCron();
    if(currentView==='dashboard') renderDashboard();
  },60000);
}

document.addEventListener('DOMContentLoaded',init);
