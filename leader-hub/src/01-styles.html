<style>
:root {
  --ink:#1e293b; --paper:#f8f9fa; --surface:#ffffff;
  --gold:#e8b84b; --gold-dk:#c9962a; --gold-light:#fef9ec;
  --navy:#0f2044; --navy2:#1a3560; --navy-soft:#eff3ff;
  --red:#dc2626; --red-light:#fef2f2;
  --green:#16a34a; --green-light:#f0fdf4;
  --blue:#2563eb; --blue-light:#eff6ff;
  --orange:#c05f1a; --purple:#6b21a8;
  --muted:#64748b; --muted-light:#f1f5f9;
  --border:#e2e8f0; --border-soft:#f1f5f9;
  --radius:16px; --radius-sm:10px; --radius-xs:8px; --r-full:9999px;
  --t-base:.18s ease; --t-fast:.1s ease;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --shadow-xl:0 24px 64px rgba(0,0,0,.22), 0 8px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.6;}
/* HEADER */
header{background:var(--navy);color:#fff;padding:0 1.75rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;border-bottom:3px solid var(--gold);box-shadow:0 2px 16px rgba(15,32,68,.18);}
.logo{font-family:'Bebas Neue',cursive;font-size:1.75rem;letter-spacing:3px;color:var(--gold);}
.logo span{color:#fff;}
nav{display:flex;gap:3px;}
nav button{background:none;border:none;color:rgba(255,255,255,.55);font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:.45rem 1rem;cursor:pointer;border-radius:8px;transition:all .15s;}
nav button:hover{color:#fff;background:rgba(255,255,255,.1);}
nav button.active{color:var(--gold);background:rgba(232,184,75,.15);}
/* LAYOUT */
.app{display:flex;height:calc(100vh - 64px);overflow:hidden;}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:1rem .75rem;flex-shrink:0;overflow-y:auto;}
.main{flex:1;overflow:hidden;background:var(--paper);}
/* Dashboard: full-height flex column, no scroll */
#view-dashboard{height:100%;overflow:hidden;display:none;flex-direction:column;padding:.75rem 1.1rem .5rem;}
#view-dashboard.active{display:flex;}
/* All other views scroll normally inside .main */
.main>.view.active:not(#view-dashboard){display:block;padding:1.5rem 2rem;height:100%;overflow-y:auto;}
/* SIDEBAR */
.slbl{font-size:.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .4rem .5rem;}
.slbl:first-child{margin-top:0;}
.si{display:flex;align-items:center;gap:.6rem;padding:.55rem .85rem;border-radius:12px;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--muted);transition:all .15s;border:none;background:none;width:100%;text-align:left;line-height:1.3;}
.si:hover{background:var(--muted-light);color:var(--ink);}
.si.active{background:var(--navy-soft);color:var(--navy);font-weight:600;}
.si .ic{font-size:.95rem;width:20px;text-align:center;flex-shrink:0;}
.sbd{margin-left:auto;background:var(--gold);color:var(--navy);font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:var(--r-full);flex-shrink:0;}
.si.active .sbd{background:var(--navy);color:#fff;}
/* VIEWS */
.view{display:none;}
.view.active{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* PAGE HEADER */
.ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:.75rem;}
.pt{font-family:'Bebas Neue',cursive;font-size:2.2rem;letter-spacing:2px;color:var(--navy);line-height:1;}
.ps{color:var(--muted);font-size:.84rem;margin-top:.25rem;font-weight:400;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:var(--radius-xs);font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .18s;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(15,32,68,.18);} .btn-primary:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(15,32,68,.22);}
.btn-gold{background:var(--gold);color:var(--navy);} .btn-gold:hover{background:var(--gold-dk);}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--ink);} .btn-outline:hover{border-color:var(--navy);color:var(--navy);}
.btn-danger{background:var(--red);color:#fff;} .btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:.35rem .8rem;font-size:.75rem;} .btn-xs{padding:.22rem .55rem;font-size:.7rem;}
/* GRID */
.grid{display:grid;gap:1.1rem;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr;}}

/* Command Center dashboard — built for a full desktop viewport (fixed 4- and
   5-column rows, no scroll by design). Below 1200px those columns get too
   narrow to read; fall back to a stacked, scrollable layout instead. */
@media(max-width:1200px){
  .main { overflow-y:auto !important; }
  #view-dashboard { height:auto !important; overflow:visible !important; }
  #choice-cards { grid-template-columns:1fr !important; }
  #pulse-row { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) !important; }
  #dash-lower-grid { grid-template-columns:1fr 1fr !important; flex:none !important; }
}
@media(max-width:760px){
  #dash-lower-grid { grid-template-columns:1fr !important; }
}
/* SIDEBAR — mobile collapse. The dashboard's internal grid already stacks
   and scrolls below these breakpoints, but the 220px sidebar itself had no
   matching rule, so on a phone it permanently ate over half the screen no
   matter which view was open. Below 760px it becomes an off-canvas panel
   toggled by a hamburger button in the header, with a tap-to-close backdrop. */
#sidebar-toggle-btn{ display:none; }
.sidebar-backdrop{ display:none; }
@media(max-width:760px){
  #sidebar-toggle-btn{ display:inline-flex; align-items:center; justify-content:center; }
  .sidebar{
    position:fixed; top:64px; left:0; bottom:0; z-index:150; width:260px; max-width:80vw;
    transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-lg);
  }
  .app.sidebar-open .sidebar{ transform:translateX(0); }
  .app.sidebar-open .sidebar-backdrop{
    display:block; position:fixed; inset:64px 0 0 0; background:rgba(0,0,0,.35); z-index:140;
  }
}
/* CARDS — hover lift; the base .card box model itself is defined once,
   below, under "DESIGN SYSTEM — CLEAN COMPONENT TOKENS" (a second .card
   rule used to live here too, with different border/padding values —
   harmless in effect since the later rule always won on source order, but
   a live trap for anyone editing this one expecting it to apply). */
.card:hover{box-shadow:var(--shadow-md);}
.card-lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.cal{border-left:4px solid var(--gold);} .cal.blue{border-left-color:var(--blue);} .cal.red{border-left-color:var(--red);} .cal.green{border-left-color:var(--green);} .cal.orange{border-left-color:var(--orange);}
/* Action cards — reference colored border style */
.action-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.35rem;box-shadow:var(--shadow);transition:all var(--t-base);cursor:pointer;display:flex;gap:1rem;align-items:flex-start;}
.action-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.action-card.danger{border-color:#fecaca;}
.action-card.warning{border-color:#fde68a;}
.action-card.success{border-color:#bbf7d0;}
.action-card.info{border-color:#bfdbfe;}
.action-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;transition:transform var(--t-base);}
.action-card:hover .action-icon{transform:scale(1.08);}
.action-icon.danger{background:#fef2f2;color:#dc2626;}
.action-icon.warning{background:#fefce8;color:#ca8a04;}
.action-icon.success{background:#f0fdf4;color:#16a34a;}
.action-icon.info{background:#eff6ff;color:#2563eb;}/* STAT */
.stat{text-align:center;padding:1.35rem .75rem;}
.stat-n{font-family:'Bebas Neue',cursive;font-size:2.6rem;color:var(--navy);line-height:1;}
.stat-l{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:.25rem;}
/* ALERTS */
.alert{border-radius:var(--radius-xs);padding:.6rem 1rem;font-size:.79rem;display:flex;align-items:flex-start;gap:.55rem;margin-bottom:.55rem;line-height:1.5;}
.aw{background:var(--gold-light);border:1px solid #f5d76e;color:#7a5900;}
.ad{background:var(--red-light);border:1px solid #fca5a5;color:#b91c1c;}
.ai{background:var(--blue-light);border:1px solid #93c5fd;color:#1d4ed8;}
.as{background:var(--green-light);border:1px solid #86efac;color:#166534;}
.ai2{background:#fdf4ff;border:1px solid #d8b4fe;color:#6b21a8;}
.aico{font-size:.9rem;flex-shrink:0;margin-top:1px;}
/* STRIP */
.strip{background:var(--navy);color:#fff;border-radius:var(--radius);padding:.9rem 1.35rem;display:flex;align-items:center;gap:1.25rem;margin-bottom:1.35rem;overflow-x:auto;}
.strip-lbl{font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
.strip-evs{display:flex;gap:.75rem;}
.se{background:rgba(255,255,255,.1);border-radius:8px;padding:.42rem .85rem;font-size:.74rem;white-space:nowrap;}
.se strong{display:block;font-size:.8rem;} .se span{color:rgba(255,255,255,.5);font-size:.68rem;}
.se.warn{background:rgba(220,38,38,.35);border:1px solid rgba(220,38,38,.5);}
/* SECTION TITLE */
.stitle{font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:2px;color:var(--navy);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem;}
.stitle::after{content:'';flex:1;height:1px;background:var(--border);}
/* CHECKLIST */
.cl{list-style:none;display:flex;flex-direction:column;gap:.3rem;}
.cl li{display:flex;align-items:flex-start;gap:.5rem;padding:.38rem .5rem;border-radius:6px;transition:background .12s;font-size:.8rem;}
.cl li:hover{background:var(--muted-light);}
.cl li.done{color:var(--muted);}
.cl li.done .clt{text-decoration:line-through;}
.cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px;font-size:.6rem;}
.cb.checked{background:var(--green);border-color:var(--green);color:#fff;}
.clt{flex:1;line-height:1.4;}
.clsub{font-size:.7rem;color:var(--muted);display:block;margin-top:1px;}
/* TIMELINE */
.tl{position:relative;padding-left:1.7rem;}
.tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:1rem;}
.tl-dot{position:absolute;left:-1.4rem;top:3px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 2px var(--gold);}
.tl-dot.done{background:var(--green);box-shadow:0 0 0 2px var(--green);}
.tl-dot.warn{background:var(--red);box-shadow:0 0 0 2px var(--red);}
.tl-dot.future{background:#ccc;box-shadow:0 0 0 2px #ccc;}
.tl-date{font-size:.67rem;color:var(--muted);font-family:'DM Mono',monospace;}
.tl-title{font-weight:600;font-size:.84rem;}
.tl-desc{font-size:.74rem;color:#64748b;}
/* PROGRESS BAR */
.pbar{height:7px;background:#eee;border-radius:4px;overflow:hidden;}
.pfill{height:100%;border-radius:4px;transition:width .5s;}
.pf-ok{background:var(--green);} .pf-warn{background:var(--orange);} .pf-danger{background:var(--red);} .pf-blue{background:linear-gradient(90deg,var(--navy),var(--blue));}
/* FORM */
.fg{display:flex;flex-direction:column;gap:.3rem;}
label{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.2px;}
input,select,textarea{border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:.5rem .75rem;font-family:'Outfit',sans-serif;font-size:.82rem;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,32,68,.08);}
/* Custom role="button" elements (approval-chain circles, wizard step-bar
   dots, SCR grid cells, dashboard shortcut rows, etc.) were made keyboard
   -operable in earlier a11y passes but never got a matching focus
   indicator — keyboard users tabbing to them saw whatever the browser's
   native default outline looks like, visually inconsistent with the navy
   ring every real form control gets above. */
.btn:focus-visible,[role="button"]:focus-visible,.scr-score:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(15,32,68,.35);}
/* The navy ring above is unreadable on the header's own navy background —
   the top nav bar and sidebar toggle are plain <button> elements sitting
   directly on var(--navy), so they need a light-colored ring instead of
   more navy-on-navy. */
header button:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.65);}
/* Same navy-on-navy problem as the header buttons above, but for close
   buttons (and DECA's Edit Season button) sitting on a navy modal header
   or navy card elsewhere in the page — .btn-on-navy marks those so they
   get the same light-colored ring instead of an invisible navy one. */
.btn-on-navy:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.65);}
textarea{resize:vertical;min-height:70px;}
.fgrid{display:grid;gap:.82rem;}
.fg2{grid-template-columns:1fr 1fr;} .fg3{grid-template-columns:1fr 1fr 1fr;}
input.missing{border-color:var(--red);background:#fff8f8;}
input.ok{border-color:var(--green);background:var(--green-light);}
/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(15,32,68,.4);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
/* The 13+ modals sharing this system used to hard-cut into view with no
   transition at all, while the older Journal modal (predating this system)
   got its own rise-in animation — the newest, most-reused modal chrome was
   the least polished, motion-wise. Applying it here (an animation on the
   .open class replays every time display flips from none to flex, since
   the browser treats that as a fresh insertion) brings all of them in line. */
.mo.open{display:flex!important;animation:moBackdropIn .18s ease;}
.mo.open .modal,.mo.open .mbox{animation:moPopIn .2s ease;}
@keyframes moBackdropIn{from{opacity:0}to{opacity:1}}
@keyframes moPopIn{from{opacity:.5;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.mo.open,.mo.open .modal,.mo.open .mbox{animation:none}}
/* FIXED: .mbox (used by 8 modals — Register DECA Member, Send Registration
   Info Request, Archive Trip, AI Knowledge Base Insights, SCR Class
   Insights, Email Composer, Sub Plan Generator, Brag Board) had zero
   matching CSS rules anywhere in the file, unlike its sibling .modal —
   those modal bodies rendered fully transparent over the blurred backdrop,
   with their navy-header-assuming subtitle/close-button colors landing on
   an invisible/white background instead. */
.modal,.mbox{background:#fff;border-radius:var(--radius);width:700px;max-width:97vw;max-height:93vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.2);}
.mhdr{padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
/* All 8 .mbox modals write their .mhdr title in default (dark) text and
   their subtitle/close-button in rgba(255,255,255,…) — they were authored
   assuming a navy header like the file's raw one-off modals, but .mhdr's
   own default background is white, so that white-on-white text was
   invisible until .mbox had any CSS at all. */
.mbox .mhdr{background:var(--navy);color:#fff;}
.mbox .mtitle{color:#fff;}
.mtitle{font-family:'Bebas Neue',cursive;font-size:1.35rem;letter-spacing:1px;color:var(--navy);}
.mclose{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);padding:.2rem .4rem;border-radius:4px;}
.mbody{padding:1.4rem;}
.mftr{padding:.9rem 1.4rem;border-top:1px solid var(--border);display:flex;gap:.6rem;justify-content:flex-end;}
/* FORM SECTION DIVIDER */
.fsec{font-family:'Bebas Neue',cursive;font-size:.9rem;letter-spacing:2px;color:var(--navy);margin:.95rem 0 .5rem;display:flex;align-items:center;gap:.5rem;}
.fsec::after{content:'';flex:1;height:1px;background:var(--border);}
/* READINESS CARD */
.rcard{border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.1rem;background:#fff;position:relative;overflow:hidden;transition:box-shadow .15s;}
.rcard:hover{box-shadow:var(--shadow-md);}
.rcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.65rem;}
.rcard-name{font-weight:700;font-size:.9rem;}
.rcard-pct{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:var(--navy);line-height:1;}
.missing-pill{font-size:.65rem;font-weight:700;background:var(--red-light);color:#b91c1c;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:.25rem;}
.ok-pill{font-size:.65rem;font-weight:700;background:#dcfce7;color:#166534;padding:2px 8px;border-radius:20px;}
.field-row{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid var(--border-soft);font-size:.79rem;}
.field-row:last-child{border:none;}
.field-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.fd-ok{background:var(--green);} .fd-miss{background:var(--red);} .fd-warn{background:var(--orange);}
.field-name{flex:1;color:#444;}
.field-action{font-size:.7rem;color:var(--blue);cursor:pointer;white-space:nowrap;}
/* PHASE TIMELINE */
.phase{display:flex;flex-direction:column;gap:.55rem;}
.phase-item{display:flex;gap:.75rem;align-items:flex-start;padding:.55rem .7rem;border-radius:var(--radius-xs);border:1px solid var(--border);background:#fff;}
.phase-item.phase-done{background:var(--green-light);border-color:#86efac;}
.phase-item.phase-active{background:var(--gold-light);border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,75,.18);}
.phase-item.phase-late{background:var(--red-light);border-color:#fca5a5;}
.phase-item.phase-future{background:var(--muted-light);border-color:var(--border);}
.phase-icon{font-size:1.1rem;flex-shrink:0;margin-top:2px;}
.phase-body{flex:1;}
.phase-label{font-weight:600;font-size:.83rem;}
.phase-sub{font-size:.74rem;color:#64748b;margin-top:.1rem;}
.phase-date{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);white-space:nowrap;margin-top:2px;}
.phase-badge{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap;}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.83rem;}
th{text-align:left;font-size:.62rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:.55rem .7rem;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:.58rem .7rem;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:hover td{background:var(--muted-light);}
.ava{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:700;margin-right:.4rem;}
/* TAGS */
.tag{font-size:.6rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:20px;}
.tag-ft{background:var(--blue-light);color:#1d4ed8;} .tag-deca{background:#fef3c7;color:#92400e;}
.tag-lead{background:#dcfce7;color:#166534;} .tag-comm{background:#f3e8ff;color:#6b21a8;}
/* STATUS */
.status{font-size:.65rem;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:6px;text-transform:uppercase;}
.st-planned{background:var(--blue-light);color:#0369a1;} .st-active{background:#dcfce7;color:#166534;}
.st-complete{background:var(--muted-light);color:#6b7280;} .st-urgent{background:var(--red-light);color:#b91c1c;}
.st-approved{background:#d1fae5;color:#065f46;} .st-pending{background:#fef9c3;color:#854d0e;}
/* COST BOX */
.cost-box{background:var(--navy);color:#fff;border-radius:var(--radius-sm);padding:1.1rem 1.3rem;}
.cr{display:flex;justify-content:space-between;font-size:.8rem;padding:.24rem 0;border-bottom:1px solid rgba(255,255,255,.08);}
.cr:last-child{border:none;font-weight:700;font-size:.9rem;padding-top:.45rem;}
.cr-l{color:rgba(255,255,255,.65);} .cr-v{font-family:'DM Mono',monospace;color:var(--gold);}
hr{border:none;border-top:1px solid var(--border);margin:1rem 0;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
/* GOAL BAR */
.gbar{flex:1;height:7px;background:#eee;border-radius:4px;overflow:hidden;}
.gfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--navy),var(--blue));}
/* PRINT */
@media print{header,.sidebar,.btn,.mo{display:none;}.no-print{display:none;} .main{padding:0;} .print-only{display:block!important;}}
.print-only{display:none;}
/* EXCLUSIONS BOX */
.excl{background:var(--red-light);border:1px solid #fca5a5;border-radius:var(--radius-xs);padding:.6rem .9rem;font-size:.78rem;color:#b91c1c;margin-bottom:.8rem;}
/* SLIP TRACKER */
.slip-row{display:flex;align-items:center;gap:.55rem;padding:.42rem .55rem;border-radius:6px;font-size:.8rem;border-bottom:1px solid var(--border-soft);transition:background .1s;}
.slip-row:last-child{border:none;}
.slip-row:hover{background:var(--muted-light);}
.slip-status{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.ss-yes{background:#dcfce7;color:#166534;} .ss-no{background:var(--red-light);color:#b91c1c;} .ss-pending{background:#fef9c3;color:#854d0e;}
/* PRINT FORM */
.pf-page{font-family:'Outfit',sans-serif;font-size:12px;line-height:1.6;max-width:680px;margin:0 auto;padding:1.5rem;}
.pf-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:.25rem;}
.pf-sub{font-size:11px;text-align:center;color:#555;margin-bottom:1.25rem;}
.pf-field{display:flex;align-items:baseline;gap:.35rem;margin-bottom:.6rem;border-bottom:1px solid #ccc;padding-bottom:.15rem;}
.pf-label{font-weight:600;font-size:11px;white-space:nowrap;}
.pf-val{flex:1;font-size:12px;color:#333;}
.pf-blank{flex:1;border-bottom:1px solid #333;min-width:200px;display:inline-block;}
.pf-section{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:1rem 0 .35rem;border-bottom:2px solid #333;padding-bottom:.15rem;}
.pf-check-row{display:flex;align-items:flex-start;gap:.5rem;margin:.4rem 0;font-size:11px;}
.pf-box{width:12px;height:12px;border:1.5px solid #333;flex-shrink:0;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;}
.pf-sig-line{border-top:1px solid #333;width:240px;display:inline-block;margin-top:1.5rem;}
.pf-sig-label{font-size:10px;color:#555;margin-top:.15rem;}
/* EMAIL COMPOSER */
.email-tab{padding:.32rem .85rem;border-radius:20px;font-size:.75rem;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--ink);transition:all .15s}
.email-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.email-tab:hover:not(.active){border-color:var(--navy);color:var(--navy)}
.etpl{width:100%;padding:.45rem .65rem;border-radius:var(--radius-xs);font-size:.72rem;cursor:pointer;border:1px solid var(--border);background:#fff;text-align:left;transition:all .15s;line-height:1.35}
.etpl:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.etpl.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
/* ARCHIVE */
.arch-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow);transition:box-shadow .2s}
.arch-card:hover{box-shadow:var(--shadow-md)}
.arch-glow-badge{display:inline-flex;align-items:center;gap:.25rem;background:var(--green-light);border:1px solid #86efac;color:#15803d;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px}
.arch-grow-badge{display:inline-flex;align-items:center;gap:.25rem;background:#fefce8;border:1px solid #fde047;color:#854d0e;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px}
.arch-star{color:#f59e0b;font-size:.85rem}
/* MEMBERS */
.member-tab{padding:.32rem .95rem;border-radius:20px;font-size:.75rem;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--ink);transition:all .15s}
.member-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.member-tab:hover:not(.active){border-color:var(--navy);color:var(--navy)}
.mb-card{border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s}
.mb-card:hover{box-shadow:var(--shadow-md)}
.mb-status{display:inline-block;font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:20px}
/* SCR */
.scr-tab{padding:.32rem .88rem;border-radius:20px;font-size:.73rem;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--ink);transition:all .15s}
.scr-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.scr-tab:hover:not(.active){border-color:var(--navy);color:var(--navy)}
.scr-table{width:100%;border-collapse:collapse;font-size:.73rem}
.scr-table th{background:var(--navy);color:#fff;padding:.42rem .48rem;text-align:center;font-size:.65rem;white-space:nowrap;position:sticky;top:0;z-index:10}
.scr-table th.comp-h{text-align:left;max-width:280px;min-width:200px}
/* FIXED (Say/Do Ledger leader-hub finding #13): the Req header used to
   carry two `style` attributes on one element, so the browser kept only
   the first (position:sticky;left:0) and silently dropped the second
   (min-width) — Req ended up pinned at the same offset as the Competency
   column instead of stacked beside it. --scr-comp-w is set at render time
   (renderScrTable()) from Competency's actual measured width, so Req
   always stacks correctly even as that width changes with viewport size. */
.scr-table th.scr-req-col,.scr-table td.scr-req-col{position:sticky;left:var(--scr-comp-w,200px);min-width:60px;z-index:15}
.scr-table th.scr-req-col{background:var(--navy);z-index:20}
.scr-table td.scr-req-col{background:#fff;border-right:1px solid #e5e7eb}
.scr-table td{padding:.3rem .42rem;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.scr-table tr:hover td{background:var(--muted-light)}
.scr-duty{background:var(--muted-light);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.8px;color:var(--navy);padding:.48rem .65rem}
.scr-score{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:6px;font-weight:700;font-size:.75rem;cursor:pointer;border:1.5px solid transparent;transition:all .15s;user-select:none}
.scr-s1{background:#dcfce7;color:#15803d;border-color:#86efac}
.scr-s2{background:var(--blue-light);color:#1d4ed8;border-color:#93c5fd}
.scr-s3{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc}
.scr-s4{background:#fef9c3;color:#92400e;border-color:#fde047}
.scr-s5{background:var(--red-light);color:#b91c1c;border-color:#fca5a5}
.scr-s0{background:var(--muted-light);color:#9ca3af;border-color:#e5e7eb}
.scr-score:hover{transform:scale(1.15);z-index:5}
.scr-opt{font-style:italic;color:#9ca3af}
.scr-pct-bar{height:5px;border-radius:3px;background:#e5e7eb;overflow:hidden;margin-top:2px}
/* Real horizontal-scroll affordance (Say/Do Ledger leader-hub finding #2)
   — the scroll container had overflow:auto but nothing visually hinting
   this table scrolls, so a phone user had to discover it by accident. A
   persistent right-edge fade plus the text hint above the table (see
   renderScrTable()) together replace that with a real, visible cue. */
.scr-scroll-wrap{position:relative}
.scr-scroll-wrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:22px;pointer-events:none;background:linear-gradient(to right,transparent,rgba(0,0,0,.10))}
.scr-pct-fill{height:100%;border-radius:3px;background:var(--navy);transition:width .3s}

    .lp-card:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(0,0,0,.12); }
    .lp-tab { background:none;border:none;padding:.6rem 1rem;font-size:.8rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;font-family:inherit }
    .lp-tab-active { color:var(--navy);border-bottom-color:var(--navy);font-weight:700 }
    .lp-tab:hover { color:var(--navy) }

  
    .wbl-tab { background:none;border:none;padding:.55rem 1rem;font-size:.8rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;font-family:inherit }
    .wbl-tab-active { color:var(--navy);border-bottom-color:var(--navy);font-weight:700 }
    .wbl-tab:hover { color:var(--navy) }

    /* ── COCKPIT ── */
    @keyframes pulse-fire { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
    @keyframes slide-in   { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes ring-in    { from{stroke-dasharray:0 100} }

    .block-task {
      display:flex;align-items:center;gap:.4rem;padding:.32rem .45rem;border-radius:6px;margin-bottom:.28rem;
      font-size:.74rem;cursor:pointer;transition:all .15s;border:1px solid transparent;animation:slide-in .2s ease;
    }
    .block-task:hover { background:#f8fafc; }
    .block-task.done  { opacity:.45;text-decoration:line-through; }
    .role-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0 }

    .pulse-card {
      background:#fff;border:1px solid var(--border);border-radius:12px;padding:.85rem .95rem;
      position:relative;overflow:hidden;transition:box-shadow .2s;cursor:pointer;
    }
    .pulse-card:hover { box-shadow:0 4px 20px rgba(0,0,0,.09); }
    .pulse-card .overdue-badge {
      position:absolute;top:.55rem;right:.55rem;background:#dc2626;color:#fff;
      font-size:.58rem;font-weight:800;padding:2px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px;
    }

    .forget-chip {
      display:inline-flex;align-items:center;gap:.35rem;background:#fff3cd;border:1px solid #fbbf24;
      border-radius:20px;padding:.3rem .75rem;font-size:.72rem;font-weight:600;color:#92400e;
      white-space:nowrap;animation:slide-in .25s ease;
    }
    .forget-chip.urgent { background:#fee2e2;border-color:#f87171;color:#991b1b; }

  /* ══════════════════════════════════════════════════
     DESIGN SYSTEM — CLEAN COMPONENT TOKENS
  ══════════════════════════════════════════════════ */

  /* Cards */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); transition:box-shadow var(--t-base), transform var(--t-base); }
  .card-sm { padding:.85rem 1rem; }
  .card-hover { transition:box-shadow var(--t-base), transform var(--t-base); cursor:pointer; }
  .card-hover:hover { box-shadow:var(--shadow-lg); transform:translateY(-1px); }

  /* ══════════════════════════════════════════════════
     CHOICE CARDS — compact viewport-fit version
  ══════════════════════════════════════════════════ */
  .choice-card {
    background:var(--surface);
    border:2.5px solid var(--border);
    border-radius:14px;
    padding:1.1rem 1.2rem;
    cursor:pointer;
    transition:box-shadow .15s, transform .15s, border-color .15s;
    position:relative; overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
    display:flex; flex-direction:column; height:100%;
  }
  .choice-card:hover { box-shadow:0 6px 20px rgba(0,0,0,.1); transform:translateY(-2px); }
  .choice-card.selected { border-color:var(--navy); background:var(--navy-soft); opacity:.75; }
  .choice-card.cc-danger  { border-color:#fecaca; }
  .choice-card.cc-warning { border-color:#fde68a; }
  .choice-card.cc-danger:hover  { border-color:#f87171; }
  .choice-card.cc-warning:hover { border-color:#fbbf24; }

  .choice-card .cc-icon-box {
    width:46px; height:46px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; flex-shrink:0;
    transition:transform .15s;
  }
  .choice-card:hover .cc-icon-box { transform:scale(1.1); }
  .choice-card .cc-label {
    font-size:.78rem; font-weight:700; text-transform:uppercase;
    letter-spacing:1.5px; color:var(--muted); margin-bottom:.4rem;
    display:flex; align-items:center; gap:.3rem;
  }
  .choice-card .cc-title {
    font-weight:700; font-size:1.08rem; color:var(--ink);
    line-height:1.35; margin-bottom:.4rem; flex:1;
  }
  .choice-card .cc-meta {
    font-size:.8rem; color:var(--muted);
    display:flex; align-items:center; gap:.35rem; flex-wrap:wrap;
    margin-bottom:.65rem;
  }
  .choice-card .cc-urgency { font-size:.76rem; font-weight:700; padding:4px 10px; border-radius:var(--r-full); }
  .choice-card .cc-role-tag { font-size:.76rem; font-weight:600; padding:4px 9px; border-radius:var(--r-full); }
  .choice-card .cc-actions { display:flex; gap:.45rem; align-items:center; margin-top:auto; }
  .choice-card .cc-pick {
    flex:1; background:var(--navy); color:#fff; border:none; border-radius:8px;
    padding:.58rem .9rem; font-size:.92rem; font-weight:600; cursor:pointer;
    transition:background .15s; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:.3rem;
  }
  .choice-card .cc-pick:hover { background:var(--navy2); }
  .choice-card .cc-snooze {
    background:none; border:1.5px solid var(--border); color:var(--muted);
    border-radius:8px; padding:.58rem .8rem; font-size:.88rem; cursor:pointer;
    transition:all .15s; font-family:inherit; white-space:nowrap;
  }
  .choice-card .cc-snooze:hover { border-color:var(--ink); color:var(--ink); }

  /* ══════════════════════════════════════════════════
     REFLECTIVE JOURNAL — STEP-BY-STEP MODAL
  ══════════════════════════════════════════════════ */
  .journal-modal {
    position:fixed; inset:0; background:rgba(10,20,45,.65);
    z-index:9999; overflow:auto; padding:1.5rem 1rem;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .journal-inner {
    background:var(--surface); max-width:560px; margin:0 auto;
    border-radius:20px; overflow:hidden;
    box-shadow:0 32px 80px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.08);
    animation:journalRise .28s cubic-bezier(.22,.97,.58,1);
  }
  @keyframes journalRise { from{opacity:0;transform:translateY(20px) scale(.97)} to{opacity:1;transform:none} }
  @keyframes journalShake {
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-7px)}
    30%{transform:translateX(7px)}
    45%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    75%{transform:translateX(-3px)}
    90%{transform:translateX(3px)}
  }

  .journal-hdr {
    background:linear-gradient(135deg, var(--navy) 0%, #1a3560 100%);
    padding:1.35rem 1.6rem 1.1rem;
    border-bottom:2px solid rgba(232,184,75,.3);
  }
  .journal-progress-track {
    display:flex; gap:4px; margin-top:1rem;
  }
  .journal-pip {
    flex:1; height:3px; border-radius:2px;
    background:rgba(255,255,255,.15); transition:background .3s ease;
  }
  .journal-pip.done  { background:var(--gold); }
  .journal-pip.active { background:rgba(232,184,75,.55); }

  /* Step pane */
  .journal-step {
    display:none; padding:1.75rem 1.6rem;
    animation:stepIn .22s ease both;
  }
  .journal-step.active { display:block; }
  @keyframes stepIn { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} }
  @keyframes stepBack { from{opacity:0;transform:translateX(-18px)} to{opacity:1;transform:none} }
  .journal-step.going-back { animation:stepBack .22s ease both; }

  .journal-step-icon {
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.35rem; margin-bottom:1rem;
    background:var(--muted-light);
  }
  .journal-step-label {
    font-size:.6rem; font-weight:700; text-transform:uppercase;
    letter-spacing:2px; color:var(--muted); margin-bottom:.35rem;
  }
  .journal-step-q {
    font-size:1.05rem; font-weight:700; color:var(--ink);
    line-height:1.4; margin-bottom:.35rem;
  }
  .journal-step-hint {
    font-size:.75rem; color:var(--muted); line-height:1.5;
    margin-bottom:1.1rem;
  }

  /* Textarea */
  .journal-ta {
    width:100%; border:2px solid var(--border); border-radius:12px;
    padding:.75rem 1rem; font-family:inherit; font-size:.88rem;
    resize:none; line-height:1.65; color:var(--ink);
    background:var(--muted-light); transition:border-color .15s, background .15s, box-shadow .15s;
    min-height:90px;
  }
  .journal-ta:focus {
    outline:none; border-color:var(--navy);
    background:var(--surface);
    box-shadow:0 0 0 3px rgba(15,32,68,.08);
  }

  /* Mood scale */
  .mood-scale {
    display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-bottom:.65rem;
  }
  .mood-btn {
    aspect-ratio:1; border-radius:10px; border:2px solid var(--border);
    background:var(--muted-light); font-size:.78rem; font-weight:700;
    cursor:pointer; transition:all .12s; display:flex; align-items:center;
    justify-content:center; font-family:inherit; color:var(--muted);
    padding:0;
  }
  .mood-btn:hover { transform:scale(1.12); border-color:var(--navy); color:var(--navy); }
  .mood-btn.selected {
    border-color:transparent; color:#fff;
    transform:scale(1.12);
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  /* mood colors 1-10 */
  .mood-btn.selected[data-n="1"]  { background:#dc2626; }
  .mood-btn.selected[data-n="2"]  { background:#ef4444; }
  .mood-btn.selected[data-n="3"]  { background:#f97316; }
  .mood-btn.selected[data-n="4"]  { background:#eab308; }
  .mood-btn.selected[data-n="5"]  { background:#84cc16; }
  .mood-btn.selected[data-n="6"]  { background:#22c55e; }
  .mood-btn.selected[data-n="7"]  { background:#10b981; }
  .mood-btn.selected[data-n="8"]  { background:#06b6d4; }
  .mood-btn.selected[data-n="9"]  { background:#3b82f6; }
  .mood-btn.selected[data-n="10"] { background:#8b5cf6; }
  .mood-labels { display:flex; justify-content:space-between; font-size:.62rem; color:var(--muted); margin-top:.15rem; }
  .mood-feedback {
    margin-top:.65rem; padding:.6rem .85rem; border-radius:10px;
    font-size:.78rem; font-weight:500; line-height:1.45;
    min-height:2.4em; transition:all .2s; background:var(--muted-light);
    color:var(--ink);
  }

  /* Journal footer */
  .journal-ftr {
    padding:1rem 1.6rem 1.25rem;
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:.75rem;
    background:#fcfcfd;
  }
  .journal-nav-btn {
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.5rem 1.2rem; border-radius:10px; font-family:inherit;
    font-size:.82rem; font-weight:600; cursor:pointer; border:none;
    transition:all .15s;
  }
  .journal-nav-btn.back {
    background:none; border:1.5px solid var(--border); color:var(--muted);
  }
  .journal-nav-btn.back:hover { border-color:var(--ink); color:var(--ink); }
  .journal-nav-btn.next {
    background:var(--navy); color:#fff;
  }
  .journal-nav-btn.next:hover { background:var(--navy2); }
  .journal-nav-btn.finish {
    background:linear-gradient(135deg,var(--gold),var(--gold-dk));
    color:var(--navy); font-weight:700;
  }
  .journal-nav-btn.finish:hover { filter:brightness(1.05); }
  .journal-skip { font-size:.72rem; color:var(--muted); cursor:pointer; background:none; border:none; font-family:inherit; padding:.3rem .5rem; border-radius:6px; }
  .journal-skip:hover { color:var(--ink); text-decoration:underline; }

  /* Summary step */
  .journal-summary-grid { display:flex; flex-direction:column; gap:.5rem; }
  .journal-summary-row {
    display:flex; align-items:flex-start; gap:.75rem;
    padding:.65rem .85rem; border-radius:12px; background:var(--muted-light);
  }
  .journal-summary-row .sr-icon { font-size:1rem; flex-shrink:0; margin-top:1px; }
  .journal-summary-row .sr-body { flex:1; }
  .journal-summary-row .sr-label { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); }
  .journal-summary-row .sr-val { font-size:.82rem; color:var(--ink); line-height:1.45; margin-top:.1rem; }
  .journal-summary-row .sr-val.empty { font-style:italic; color:var(--muted); }

  /* Thought Organizer result items */
  .thought-item { display:flex; align-items:flex-start; gap:.5rem; padding:.4rem .5rem; border-radius:7px; background:#f8fafc; margin-bottom:.3rem; cursor:pointer; transition:background var(--t-fast); border:1px solid transparent; }
  .thought-item:hover { background:var(--navy-soft,#eef2f9); border-color:var(--border); }
  .thought-badge { font-size:.58rem; font-weight:700; padding:2px 7px; border-radius:var(--r-full); white-space:nowrap; flex-shrink:0; margin-top:1px; }
  .tb-now { background:#fee2e2; color:#991b1b; }
  .tb-today { background:#fef9c3; color:#854d0e; }
  .tb-week { background:#f0fdf4; color:#166534; }
  .tb-delegate { background:#f5f3ff; color:#5b21b6; }

  /* Cron status badge */
  .cron-badge { display:inline-flex; align-items:center; gap:.35rem; font-size:.65rem; font-weight:600; padding:3px 9px; border-radius:var(--r-full); }
  .cron-ok   { background:#f0fdf4; color:#15803d; border:1px solid #86efac; }
  .cron-warn { background:#fef9c3; color:#854d0e; border:1px solid #fde047; }
  .cron-idle { background:#f1f5f9; color:var(--muted); border:1px solid var(--border); }

  /* Mood bar (journal history) */
  .mood-bar { height:4px; border-radius:2px; flex:1; }
  .mood-high  { background:#16a34a; }
  .mood-mid   { background:#d97706; }
