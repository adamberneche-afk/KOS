<script>
// FIXED: this used to show every uncaught error as a raw, undismissable,
// monospace stack-trace-style banner ("JS ERROR: ... at line N:M") — a
// debug-mode leftover left permanently live, so any real user hitting any
// bug saw developer-facing internals instead of a normal error message.
// The raw detail still goes to the console (nothing lost for debugging);
// the on-page banner is now a plain-language message with a dismiss
// button, and won't stack a second banner on top of a repeated error.
//
// UPDATED: CCPS blocks DevTools outright on script.google.com, so the
// console.error() below is now write-only — there is no way to ever read
// it back if the console can't be opened. Added a collapsed "Details"
// toggle so the same message/location the console gets is also available
// on-page, on demand, without going back to a stack-trace-always-visible
// banner for every user on every error.
window.onerror = function(msg, src, line, col, err) {
  console.error('[Uncaught error]', msg, 'at', src + ':' + line + ':' + col, err);
  if (document.getElementById('js-error-banner')) return false;
  const d = document.createElement('div');
  d.id = 'js-error-banner';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:10px 16px;font-family:system-ui,sans-serif;font-size:13px;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,.15)';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:12px';
  const msgSpan = document.createElement('span');
  msgSpan.style.flex = '1';
  msgSpan.textContent = '⚠️ Something went wrong. Try refreshing the page — your data is saved locally and won\'t be lost.';
  const detailsBtn = document.createElement('button');
  detailsBtn.textContent = 'Details';
  detailsBtn.setAttribute('aria-label', 'Show error details');
  detailsBtn.style.cssText = 'background:rgba(255,255,255,.15);border:none;color:#fff;font-size:12px;cursor:pointer;padding:3px 8px;border-radius:4px;line-height:1;white-space:nowrap';
  const btn = document.createElement('button');
  btn.textContent = '✕';
  btn.setAttribute('aria-label', 'Dismiss');
  btn.style.cssText = 'background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:0 4px;line-height:1';
  btn.onclick = function() { d.remove(); };
  row.appendChild(msgSpan);
  row.appendChild(detailsBtn);
  row.appendChild(btn);

  // Message + location only, not err.stack — enough to diagnose without
  // reintroducing an always-visible raw-stack-trace banner.
  const detailRow = document.createElement('div');
  detailRow.style.cssText = 'display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.3);font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;opacity:.9';
  detailRow.textContent = msg + ' — at ' + src + ':' + line + ':' + col;
  detailsBtn.onclick = function() {
    const showing = detailRow.style.display !== 'none';
    detailRow.style.display = showing ? 'none' : 'block';
    detailsBtn.textContent = showing ? 'Details' : 'Hide';
  };

  d.appendChild(row);
  d.appendChild(detailRow);
  document.body.appendChild(d);
  return false;
};
</script>
