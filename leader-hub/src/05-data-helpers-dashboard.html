<script>
// Tracks whether a save-failed warning has already been shown this page
// load — a full quota means EVERY subsequent LS.set() call fails too, and
// nothing here should spam a toast on every single one of them.
let _lsWriteFailWarned = false;
let _lsReadFailWarned = false;
const LS = {
  // FIXED: this used to swallow every read failure silently — no
  // console log, no distinction between "key never existed" (normal,
  // returns def) and "key exists but is corrupted JSON" (a real
  // problem). If any of the 78+ persisted keys gets truncated (quota
  // pressure mid-write, a bad hand-edited import, a browser crash),
  // the app silently falls back to the default and looks exactly like
  // the user's trips/journal/roster vanished, with no indication why —
  // the same failure mode LS.set()'s fix (below) was written to close,
  // just on the read side. Own sentinel, not LS.set's: a read failure
  // and a write failure are different problems (corrupted data vs.
  // inaccessible storage) worth telling apart in the log even though
  // both use the same one-toast-per-page-load convention.
  get: (k, def=null) => {
    try { const v=localStorage.getItem(k); return v?JSON.parse(v):def; }
    catch (e) {
      console.error('[LS.get] read failed for key', k, e);
      if (!_lsReadFailWarned && typeof _showToast === 'function') {
        _lsReadFailWarned = true;
        _showToast('⚠ Could not read saved data — some information may not have loaded.', 6000, '#991b1b');
      }
      return def;
    }
  },
  // FIXED: this used to swallow every write failure (including a full
  // storage quota) with an empty catch block — no return value, no
  // console log, no user-visible sign anything went wrong. With 78+ keys
  // that only grow (trip history, journal entries, daily logs...), a full
  // quota meant silent, permanent data loss with zero indication. Now
  // returns whether the write actually succeeded, and surfaces one toast
  // per page load if it didn't — callers that care can still check the
  // return value, but the common case (fire-and-forget) is no longer silent.
  set: (k, v) => {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      _lhSyncConfigKeyToServer_(k, v);
      _lhSyncDataKeyToServer_(k, v);
      return true;
    } catch (e) {
      console.error('[LS.set] write failed for key', k, e);
      if (!_lsWriteFailWarned && typeof _showToast === 'function') {
        _lsWriteFailWarned = true;
        _showToast('⚠ Could not save — your device\'s storage may be full. Export a backup soon.', 6000, '#991b1b');
      }
      return false;
    }
  },
};

// ── Server write-through for singleton config domains (server-migration
// Phase 3) ───────────────────────────────────────────────────────────────
// A "singleton config domain" is a small settings object kept in one
// localStorage key (Profile, Modules, Schedule Config, ...) as opposed to
// a growing multi-record list (trips, roster, scores, ...), which gets its
// own real Spreadsheet tab with proper conflict handling in a later phase
// — this list is deliberately NOT those. Every key here also exists in
// Config.gs's LH_CONFIG_KEYS; kept as two lists (not one shared file)
// because the client can't require() the .gs file — if you add a domain
// to one, add it to the other too, or lhSaveConfig_() will just reject it.
//
// This hooks LS.set() itself rather than each domain's own
// getX()/persistX() wrapper (or the many call sites for domains that have
// no single wrapper — several of these are read/written inline at their
// point of use throughout the file) so every existing call site gets the
// write-through automatically, with no per-call-site changes anywhere.
const LH_SERVER_SYNCED_CONFIG_KEYS = [
  'lh_profile', 'lh_modules', 'lh_schedule_config', 'lh_custom_orgs',
  'lh_custom_courses', 'lh_keyContacts', 'lh_student_id_map',
  'lh_cas_ccps_api_url', 'lh_cas_ccps_oauth_client_id', 'lh_sub_settings',
  'lh_sub_period_assignments', 'lh_sbe_status', 'lh_deca_season',
  'lh_deca_approvals', 'lh_ftp_overrides', 'lh_conf_leave', 'lh_mk8_check',
  'lh_ssbu_check', 'lh_obs_prep', 'lh_sync_tracker', 'lh_sub_student_notes',
  // Phase 5: map-shaped (keyed by tripId / orgId), not a flat list of
  // independent records — see LH_SERVER_SYNCED_DATA_KEYS below for that
  // distinction, and Config.gs for why these two live here.
  'lh_slip_rosters', 'lh_org_results',
  // Phase 6: Course Catalog / SCR support data, all map-shaped. The real
  // SCR scores are NOT here — see LH_SERVER_SYNCED_DATA_KEYS/
  // leader-hub/SCR.gs for why that domain needs a different shape.
  'lh_custom_pacing_units', 'lh_cas_pacing_notes', 'lh_scr_student_emails',
  // Phase 7: map-shaped (keyed by purchase-order id). lh_wbl_hours_log is
  // deliberately NOT synced anywhere yet — its entries have no `id` field
  // and are capped at 200, so neither this mechanism nor
  // LH_SERVER_SYNCED_DATA_KEYS fits without a fragile synthetic key.
  'lh_receiving_status',
  // Phase 8: the Horizon system uses its own bucketed {short,mid,long}
  // shape, not a flat record list — see LH_SERVER_SYNCED_DATA_KEYS for the
  // id-less logs (lh_daily_log, lh_sub_plan_log, lh_brag_log) deliberately
  // left out of both mechanisms.
  'lh_horizon',
  // Phase 9: Lesson Plan content edits, both keyed by a lesson/unit
  // identifier rather than a flat record list.
  'lh_lp_edits', 'lh_lp_edit_meta',
];

// Fire-and-forget — never blocks or throws back into the LS.set() caller.
// Same-origin only (google.script.run doesn't exist for a locally-opened
// file); a failed sync just logs a warning, since localStorage already has
// the value regardless of whether the server copy lands.
function _lhSyncConfigKeyToServer_(key, value) {
  if (LH_SERVER_SYNCED_CONFIG_KEYS.indexOf(key) === -1) return;
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) return;
  google.script.run
    .withFailureHandler(err => console.warn('[LeaderHub] config sync failed for ' + key + ':', (err && err.message) || err))
    .lhSaveConfig_(key, value);
}

// Called once at boot (see the boot sequence's EMAIL_BRIDGE.poll() call) —
// same-origin only, a no-op when opened as a local file. Pulls every
// server-synced config domain in one round trip and catches this browser
// up on anything saved from a different device/browser since it last
// opened the app. Most of these domains are read fresh via LS.get() at
// every point of use, so writing the server's copy into localStorage IS
// the whole refresh for them; a handful also cache into a persistent
// in-memory variable and need that re-applied too, listed explicitly
// below rather than guessed at generically. Uses raw localStorage.setItem
// (not LS.set) so applying a value the server just gave us doesn't
// immediately re-queue the exact same value right back to it.
async function lhRefreshConfigFromServer_() {
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) return;
  let remote;
  try {
    remote = await new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).lhGetAllConfig_();
    });
  } catch (e) {
    console.warn('[LeaderHub] Could not refresh settings from server:', (e && e.message) || e);
    return;
  }
  if (!remote) return;

  const _write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // Read fresh via LS.get() at point of use everywhere — localStorage
  // catch-up is the entire refresh, nothing else to re-apply.
  ['lh_keyContacts', 'lh_student_id_map', 'lh_cas_ccps_api_url',
   'lh_cas_ccps_oauth_client_id', 'lh_sub_settings',
   'lh_sub_period_assignments', 'lh_deca_approvals', 'lh_obs_prep',
   'lh_sync_tracker', 'lh_sub_student_notes'].forEach(k => {
    if (remote[k] !== null && remote[k] !== undefined) _write(k, remote[k]);
  });

  // Cached into a persistent in-memory variable — write through
  // localStorage AND re-apply, so an already-rendered page picks up a
  // change made elsewhere without a manual reload.
  if (remote.lh_profile != null)        { _write('lh_profile', remote.lh_profile); Object.assign(PROFILE, PROFILE_DEFAULTS, remote.lh_profile); _applyProfileToStaticDOM(); }
  if (remote.lh_modules != null)        { _write('lh_modules', remote.lh_modules); Object.assign(MODULES, MODULES_DEFAULT, remote.lh_modules); _applyModuleVisibility(); }
  if (remote.lh_custom_orgs != null)    { _write('lh_custom_orgs', remote.lh_custom_orgs); Object.assign(CUSTOM_ORGS, remote.lh_custom_orgs); Object.assign(ORGANIZATIONS, ORG_DEFAULTS, CUSTOM_ORGS); }
  if (remote.lh_custom_courses != null) { _write('lh_custom_courses', remote.lh_custom_courses); Object.assign(CUSTOM_COURSES, remote.lh_custom_courses); }
  if (remote.lh_ftp_overrides != null)  { _write('lh_ftp_overrides', remote.lh_ftp_overrides); Object.assign(ftPermOverrides, remote.lh_ftp_overrides); }
  if (remote.lh_conf_leave != null)     { _write('lh_conf_leave', remote.lh_conf_leave); Object.assign(confLeaveRecords, remote.lh_conf_leave); }
  if (remote.lh_sbe_status != null)     { _write('lh_sbe_status', remote.lh_sbe_status); Object.assign(SBE_STATUS, remote.lh_sbe_status); }
  if (remote.lh_deca_season != null)    { _write('lh_deca_season', remote.lh_deca_season); Object.assign(DECA_SEASON, remote.lh_deca_season); }
  if (remote.lh_ssbu_check != null)     { _write('lh_ssbu_check', remote.lh_ssbu_check); Object.assign(SSBU_CHECK_STATUS, remote.lh_ssbu_check); }
  if (remote.lh_mk8_check != null)      { _write('lh_mk8_check', remote.lh_mk8_check); Object.assign(MK8_CHECK_STATUS, remote.lh_mk8_check); }
  if (remote.lh_schedule_config != null) {
    _write('lh_schedule_config', remote.lh_schedule_config);
    if (typeof _applyScheduleConfig === 'function') _applyScheduleConfig();
    if (typeof _applyQuartersConfig === 'function') _applyQuartersConfig();
  }
  if (remote.lh_slip_rosters != null) {
    _write('lh_slip_rosters', remote.lh_slip_rosters);
    Object.keys(slipRosters).forEach(k => delete slipRosters[k]);
    Object.assign(slipRosters, remote.lh_slip_rosters);
  }
  if (remote.lh_org_results != null) {
    _write('lh_org_results', remote.lh_org_results);
    Object.keys(ORG_RESULTS).forEach(k => delete ORG_RESULTS[k]);
    Object.assign(ORG_RESULTS, remote.lh_org_results);
  }
  if (remote.lh_custom_pacing_units != null) {
    _write('lh_custom_pacing_units', remote.lh_custom_pacing_units);
    Object.keys(CUSTOM_PACING_UNITS).forEach(k => delete CUSTOM_PACING_UNITS[k]);
    Object.assign(CUSTOM_PACING_UNITS, remote.lh_custom_pacing_units);
  }
  if (remote.lh_cas_pacing_notes != null) {
    _write('lh_cas_pacing_notes', remote.lh_cas_pacing_notes);
    Object.keys(CAS_PACING_NOTES).forEach(k => delete CAS_PACING_NOTES[k]);
    Object.assign(CAS_PACING_NOTES, remote.lh_cas_pacing_notes);
  }
  if (remote.lh_scr_student_emails != null) {
    _write('lh_scr_student_emails', remote.lh_scr_student_emails);
    Object.keys(SCR_STUDENT_EMAILS).forEach(k => delete SCR_STUDENT_EMAILS[k]);
    Object.assign(SCR_STUDENT_EMAILS, remote.lh_scr_student_emails);
  }
  if (remote.lh_receiving_status != null) {
    _write('lh_receiving_status', remote.lh_receiving_status);
    Object.keys(RECEIVING_STATUS).forEach(k => delete RECEIVING_STATUS[k]);
    Object.assign(RECEIVING_STATUS, remote.lh_receiving_status);
  }
  if (remote.lh_horizon != null) {
    _write('lh_horizon', remote.lh_horizon);
    Object.keys(HORIZON).forEach(k => delete HORIZON[k]);
    Object.assign(HORIZON, remote.lh_horizon);
    if (typeof renderHorizons === 'function') renderHorizons();
  }
  if (remote.lh_lp_edits != null) {
    _write('lh_lp_edits', remote.lh_lp_edits);
    // LP_EDITS is a const object reference — mutate in place rather than
    // reassign, same convention as ORGANIZATIONS/ORG_RESULTS above.
    Object.keys(LP_EDITS).forEach(k => delete LP_EDITS[k]);
    Object.assign(LP_EDITS, remote.lh_lp_edits);
  }
  if (remote.lh_lp_edit_meta != null) {
    // No persistent in-memory variable — every reader calls
    // LS.get('lh_lp_edit_meta', {}) fresh.
    _write('lh_lp_edit_meta', remote.lh_lp_edit_meta);
  }
}

// ── Server write-through for row-shaped data domains (server-migration
// Phase 5+) ──────────────────────────────────────────────────────────────
// A row-shaped domain is a growing flat list of independent records with
// their own `id` (trips, trip archive, DECA results, ...) — as opposed to
// the map-shaped domains just above, and the small singleton settings
// objects further up. Synced automatically, same as the config domains —
// see leader-hub/Data.gs's own header comment for why that's safe here
// (a private, owner-only Spreadsheet, not Organization Sync's deliberate
// co-advisor-sharing one).
//
// Each record is pushed/pulled as one [Id, RecordJSON] row rather than
// flattening every field into its own column — this domain list already
// covers records as structurally different as a ~50-field trip (with a
// nested `ap` approvals object) and a 6-field DECA result, and a
// schema-agnostic row shape means adding a field to a record's own object
// literal never requires a matching server-side or sync-layer change.
// leader-hub/Data.gs's tab is still real per-record ROWS, not one giant
// blob for the whole domain — same "a stray corrupt record can't corrupt
// its neighbors" property flat columns would give, just JSON per cell
// instead of JSON per field.
const LH_SERVER_SYNCED_DATA_KEYS = {
  lh_trips: 'trips',
  lh_trip_archive: 'trip_archive',
  lh_deca_results: 'deca_results',
  lh_wbl_students: 'wbl_roster',
  lh_inventory: 'store_inventory',
  lh_sales_log: 'store_sales_log',
  lh_purchase_orders: 'store_purchase_orders',
  lh_es_players: 'esports_players',
  lh_es_matches: 'esports_matches',
  lh_goals: 'goals',
  lh_events: 'events',
  lh_tasks: 'tasks',
  lh_deadlines: 'deadlines',
  lh_journal_history: 'journal_entries',
  lh_obs_history: 'observation_history',
  lh_brag_manual_wins: 'brag_manual_wins',
};

function _lhDataTrackerKey_(domain) { return 'lh_data_sync_' + domain; }
function _lhGetDataTracker_(domain) { return LS.get(_lhDataTrackerKey_(domain), { lastKnownRemoteUpdatedAt: null }); }
// Raw localStorage, not LS.set() — a tracker key is bookkeeping about a
// sync, not itself a synced domain, and must never recursively trigger
// this same hook.
function _lhSetDataTracker_(domain, tracker) {
  try { localStorage.setItem(_lhDataTrackerKey_(domain), JSON.stringify(tracker)); } catch (e) {}
}

// One-warning-per-domain-per-page-load, same convention as LS.set/LS.get's
// own _lsWriteFailWarned/_lsReadFailWarned — a background sync hitting a
// real conflict (this browser's edit is safe locally, just not yet
// pushed) shouldn't spam a toast on every subsequent write.
let _lhDataConflictWarned = {};

// Fire-and-forget — never blocks or throws back into the LS.set() caller.
// A rejected (conflicting) push never overwrites the server and never
// touches this browser's own localStorage copy either — the edit stays
// exactly as safe as it always was, just not yet synced. No interactive
// dialog here (contrast with Organization Sync's button-triggered push,
// which does show one) — this runs in the background on every save, not
// in response to a deliberate "sync now" click.
async function _lhSyncDataKeyToServer_(key, value) {
  const domain = LH_SERVER_SYNCED_DATA_KEYS[key];
  if (!domain) return;
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) return;

  const tracker = _lhGetDataTracker_(domain);
  const rows = (Array.isArray(value) ? value : []).map(rec => [
    (rec && rec.id != null) ? String(rec.id) : '',
    JSON.stringify(rec),
  ]);
  let res;
  try {
    res = await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error((err && err.message) || String(err))))
        .lhPushData_({ domain, headers: ['Id', 'RecordJSON'], rows, expectedUpdatedAt: tracker.lastKnownRemoteUpdatedAt });
    });
  } catch (e) {
    console.warn('[LeaderHub] Sync failed for ' + domain + ':', (e && e.message) || e);
    return;
  }
  if (res && res.ok) {
    _lhSetDataTracker_(domain, { lastKnownRemoteUpdatedAt: res.updatedAt });
    return;
  }
  if (res && res.conflict && !_lhDataConflictWarned[domain]) {
    _lhDataConflictWarned[domain] = true;
    console.warn('[LeaderHub] ' + domain + ' has changes from elsewhere this browser hasn\'t synced yet — this edit stayed safe locally but wasn\'t pushed to the server.');
    if (typeof _showToast === 'function') {
      _showToast('⚠ ' + domain + ' changed elsewhere — reload once things settle to catch up', 6000, '#b45309');
    }
  }
}

// Boot-time catch-up for every row-shaped domain, same shape as
// lhRefreshConfigFromServer_() above — only overwrites this browser's
// copy when the server actually has something (found:true); a
// never-synced domain keeps whatever's already in localStorage (this
// browser's own seed data, on the very first sync).
async function lhRefreshDataDomainsFromServer_() {
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) return;

  const APPLY = {
    trips: arr => {
      trips = arr;
      localStorage.setItem('lh_trips', JSON.stringify(trips));
      if (typeof renderTrips === 'function') renderTrips();
      if (typeof renderDashboard === 'function') renderDashboard();
    },
    trip_archive: arr => {
      tripArchive = arr;
      localStorage.setItem('lh_trip_archive', JSON.stringify(tripArchive));
      if (typeof renderArchive === 'function') renderArchive();
    },
    deca_results: arr => {
      // No persistent in-memory variable — every reader already calls
      // LS.get('lh_deca_results', []) fresh, so the localStorage write is
      // the whole refresh; re-render only if that view happens to be open.
      localStorage.setItem('lh_deca_results', JSON.stringify(arr));
      if (typeof renderDecaResults === 'function') renderDecaResults();
    },
    wbl_roster: arr => {
      WBL_STUDENTS = arr;
      localStorage.setItem('lh_wbl_students', JSON.stringify(WBL_STUDENTS));
      if (typeof renderWBLTracker === 'function') renderWBLTracker();
    },
    store_inventory: arr => {
      INVENTORY = arr;
      localStorage.setItem('lh_inventory', JSON.stringify(INVENTORY));
      if (typeof renderProcurement === 'function') renderProcurement();
    },
    store_sales_log: arr => {
      SALES_LOG = arr;
      localStorage.setItem('lh_sales_log', JSON.stringify(SALES_LOG));
      if (typeof renderFinance === 'function') renderFinance();
    },
    store_purchase_orders: arr => {
      PURCHASE_ORDERS = arr;
      localStorage.setItem('lh_purchase_orders', JSON.stringify(PURCHASE_ORDERS));
      if (typeof renderProcurement === 'function') renderProcurement();
    },
    esports_players: arr => {
      ES_PLAYERS = arr;
      localStorage.setItem('lh_es_players', JSON.stringify(ES_PLAYERS));
      if (typeof renderESRoster === 'function') renderESRoster();
    },
    esports_matches: arr => {
      ES_MATCHES = arr;
      localStorage.setItem('lh_es_matches', JSON.stringify(ES_MATCHES));
      if (typeof renderMatchLog === 'function') renderMatchLog();
    },
    goals: arr => {
      goals = arr;
      localStorage.setItem('lh_goals', JSON.stringify(goals));
      if (typeof renderGoals === 'function') renderGoals();
    },
    events: arr => {
      otherEvents = arr;
      localStorage.setItem('lh_events', JSON.stringify(otherEvents));
      if (typeof renderEvents === 'function') renderEvents();
      if (typeof renderDECAPipeline === 'function') renderDECAPipeline();
    },
    tasks: arr => {
      // No persistent in-memory variable — every reader already calls
      // LS.get('lh_tasks', []) fresh, so the localStorage write is the
      // whole refresh; refreshNextAction() re-derives the action queue
      // that reads from it.
      localStorage.setItem('lh_tasks', JSON.stringify(arr));
      if (typeof refreshNextAction === 'function') refreshNextAction();
    },
    deadlines: arr => {
      DEADLINES = arr;
      localStorage.setItem('lh_deadlines', JSON.stringify(DEADLINES));
      if (typeof renderDeadlines === 'function') renderDeadlines();
    },
    journal_entries: arr => {
      // No persistent in-memory variable (lh_journal_last, a single most-
      // recent entry, is separate and untouched) — every reader calls
      // LS.get('lh_journal_history', []) fresh.
      localStorage.setItem('lh_journal_history', JSON.stringify(arr));
    },
    observation_history: arr => {
      localStorage.setItem('lh_obs_history', JSON.stringify(arr));
      if (typeof renderObsChecklist === 'function') renderObsChecklist();
    },
    brag_manual_wins: arr => {
      localStorage.setItem('lh_brag_manual_wins', JSON.stringify(arr));
    },
  };

  for (const [key, domain] of Object.entries(LH_SERVER_SYNCED_DATA_KEYS)) {
    let res;
    try {
      res = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error((err && err.message) || String(err))))
          .lhPullData_({ domain });
      });
    } catch (e) {
      console.warn('[LeaderHub] Could not refresh ' + domain + ' from server:', (e && e.message) || e);
      continue;
    }
    if (res && res.ok && res.found) {
      const arr = (res.rows || [])
        .map(r => { try { return JSON.parse(r[1]); } catch (e) { return null; } })
        .filter(Boolean);
      const apply = APPLY[domain];
      if (apply) apply(arr);
      _lhSetDataTracker_(domain, { lastKnownRemoteUpdatedAt: res.updatedAt });
    }
  }
}

// ── SCR score sync — debounced, per-cell (server-migration Phase 6) ────────
// scrScores is a course→period→student→competency matrix that can span
// thousands of cells, and setScore() (leader-hub/src/09-...-esports.html)
// fires on every single grid click — orders of magnitude past a Script
// Property's ~9KB value limit if pushed whole (Config.gs's model), and a
// wholesale-tab-rewrite per click (Data.gs's model) would both be slow and
// rewrite the entire gradebook on every keystroke of a fast grading pass.
// See leader-hub/SCR.gs for the server side (one real row per cell,
// upserted by composite key). This queues each change and flushes a whole
// batch in one call after a short pause in clicking, rather than one round
// trip per click.
const SCR_SYNC_DEBOUNCE_MS = 2000;
let _scrSyncQueue = []; // [{course, period, studentKey, compNum, score}]
let _scrSyncTimer = null;

function _lhQueueScrScoreSync_(course, period, studentKey, compNum, score) {
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) return; // local-file mode: nothing to sync to
  // Replace any already-queued change to this exact cell rather than
  // appending a duplicate — a fast clicker cycling a score 0→1→2→3 should
  // sync once with the final value, not four separate stale writes.
  _scrSyncQueue = _scrSyncQueue.filter(c => !(c.course === course && c.period === period && c.studentKey === studentKey && c.compNum === compNum));
  _scrSyncQueue.push({ course, period, studentKey, compNum, score });
  if (_scrSyncTimer) clearTimeout(_scrSyncTimer);
  _scrSyncTimer = setTimeout(_lhFlushScrScoreSync_, SCR_SYNC_DEBOUNCE_MS);
}

async function _lhFlushScrScoreSync_() {
  _scrSyncTimer = null;
  if (!_scrSyncQueue.length) return;
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) { _scrSyncQueue = []; return; }
  const batch = _scrSyncQueue;
  _scrSyncQueue = [];
  try {
    await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error((err && err.message) || String(err))))
        .lhSaveScrScores_(batch);
    });
  } catch (e) {
    // Not re-queued automatically — the edit is already safe in scrScores/
    // localStorage via persistSCR() (setScore() calls that first, before
    // this ever runs); the next real edit to any cell queues and flushes
    // again, so a transient failure here doesn't strand an edit forever.
    console.warn('[LeaderHub] SCR score sync failed for ' + batch.length + ' cell(s):', (e && e.message) || e);
  }
}

// Boot-time catch-up, same found:false/found:true-guarded shape as
// lhRefreshConfigFromServer_()/lhRefreshDataDomainsFromServer_() above —
// found:false (this deployment has never had a score pushed to it) leaves
// scrScores untouched; found:true replaces it wholesale with the server's
// authoritative copy, since by the time any score has ever been synced,
// the server is the source of truth every device should converge on.
async function lhRefreshScrScoresFromServer_() {
  if (!(typeof google !== 'undefined' && google.script && google.script.run)) return;
  let res;
  try {
    res = await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error((err && err.message) || String(err))))
        .lhGetScrScores_();
    });
  } catch (e) {
    console.warn('[LeaderHub] Could not refresh SCR scores from server:', (e && e.message) || e);
    return;
  }
  if (res && res.ok && res.found) {
    scrScores = res.scores || {};
    localStorage.setItem('lh_scr_scores', JSON.stringify(scrScores));
    if (document.getElementById('view-competency')?.classList.contains('active') && typeof renderCompetencyView === 'function') {
      renderCompetencyView();
    }
  }
}

// Hides the nav button + whole sidebar section (header+body+its trailing
// separator, see the HTML — each is wrapped in a side-sec-<key> div) for
// any disabled module, and re-filters the Dashboard pulse row to match.
// (The DOM ids stay nav-deca/side-sec-deca/acc-deca — internal hooks, not
// user-visible — while the flag/label they're driven by is now generic;
// see _applyOrgNavLabels() for the visible "DECA" → org-name(s) text.)
function _applyModuleVisibility() {
  [['orgs', 'nav-deca', 'side-sec-deca'], ['wbl', 'nav-wbl', 'side-sec-wbl'], ['esports', 'nav-esports', 'side-sec-esports']].forEach(([key, navId, sideId]) => {

    if (navEl) navEl.style.display = show ? '' : 'none';

// Keeps the nav button and sidebar accordion header's visible "DECA" text
// honest once other organizations can be added: shows the one configured
// organization's own name/icon, or "Organizations" once there's more than
// one. Called at boot and after any org import/removal.
//
// Also refreshes a handful of narrower, lower-value spots elsewhere in the
// app that still show a literal "DECA" string rather than reading it from
// config — the sub-plan absence-reason dropdown, the trip-archive filter
// button, and the permission-slip roster-source button. Those three are
// specifically about DECA's own built-in config (ORGANIZATIONS.deca —
// there is no UI to rename the built-in org today, but a teacher forking
// this file for their own club/CTSO can hand-edit ORG_DEFAULTS.deca once
// and have every one of these follow, instead of hunting down each
// hardcoded string individually). They intentionally do NOT track custom
// imported organizations — those are covered by the separate, fully
// generic ORG_RESULTS/renderOrgResults() system.
function _applyOrgNavLabels() {
  const ids = Object.keys(ORGANIZATIONS);
  const single = ids.length === 1 ? ORGANIZATIONS[ids[0]] : null;
  const icon = single ? (single.icon || '🏆') : '🏆';
  const name = single ? single.name : 'Organizations';
  const navBtn = document.getElementById('nav-deca');
  if (navBtn) navBtn.textContent = `${icon} ${name}`;
  const accHd = document.getElementById('acc-deca');
  if (accHd) {
    const arrowTxt = accHd.querySelector('.acc-arrow')?.textContent || '▶';
    accHd.innerHTML = `<span>${icon}</span> ${escH(name)} <span class="acc-arrow">${arrowTxt}</span>`;
  }

  const decaOrg  = ORGANIZATIONS.deca;
  const decaIcon = decaOrg ? (decaOrg.icon || '🏆') : '🏆';
  const decaName = decaOrg ? decaOrg.name : 'DECA';

  const reasonOpt = document.getElementById('sp-reason-deca-opt');
  if (reasonOpt) reasonOpt.textContent = `${decaIcon} ${decaName} Trip`;

  const archiveBtn = document.getElementById('af-deca');
  if (archiveBtn) archiveBtn.textContent = `${decaIcon} ${decaName}`;

  const slipSrcBtn = document.getElementById('as-src-deca');
  if (slipSrcBtn) slipSrcBtn.textContent = `${decaIcon} ${decaName} Members`;
}

function getMissingFields(trip) {
  return REQUIRED_FIELDS.filter(f => {
    const v = trip[f.key];
    if(f.check) return !f.check(v);
    return !v || v === '' || v === 0;
  });
}

function getReadinessPct(trip) {
  const missing = getMissingFields(trip).length;
  return Math.round(((REQUIRED_FIELDS.length - missing) / REQUIRED_FIELDS.length) * 100);
}

const fd = d => { if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
const du = d => { if(!d) return ''; const diff=Math.ceil((new Date(d+'T00:00:00')-new Date())/86400000); if(diff<0)return'Past'; if(diff===0)return'Today!'; return diff+' day'+(diff===1?'':'s')+' away'; };
const dn = d => { if(!d) return 9999; return Math.ceil((new Date(d+'T00:00:00')-new Date())/86400000); };
// 'out-of-state'/'overnight'/'grant'/'rental' are pre-wizard trip-type
// strings — no trip made through the current wizard (same-day/overnight-is/
// overnight-oos/multi-day/international) can ever produce them, so every
// wizard-created overnight/multi-day trip was silently getting the 30-day
// same-day lead time instead of the intended 45.
const leadDays = sub => { if(sub==='international')return 365; if(['overnight-is','overnight-oos','multi-day'].includes(sub))return 45; return 30; };
// Shared "is this trip overnight/multi-day/international" check — the same
// dead-string list ('overnight'/'out-of-state') was duplicated inline in
// several email templates below; centralizing it means the next taxonomy
// change only needs to happen once.
const isOvernightTrip = t => ['overnight-is','overnight-oos','multi-day','international'].includes(t?.sub || '');
const subDeadline = t => { const lead=leadDays(t.sub||'same-day'); if(!t.date)return null; const d=new Date(t.date+'T00:00:00'); d.setDate(d.getDate()-lead); return d; };
const fmtDeadline = t => { const dl=subDeadline(t); if(!dl)return null; return dl.toISOString().split('T')[0]; };

function showView(name, btn) {
  try {
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    const viewEl = document.getElementById('view-'+name);
    if (!viewEl) { console.warn('showView: no view-'+name); return; }
    viewEl.classList.add('active');
    // Remembered on next boot — see the restore call at the bottom of the
    // script. A deep session in, say, Lessons used to always get thrown
    // back to the Dashboard on every refresh.
    if (!window._appBooting) LS.set('lh_last_view', name);
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.si').forEach(b=>b.classList.remove('active'));
    if(btn && btn.classList) btn.classList.add('active');
    // ── Render the active view ────────────────────────────────────────────
    if(name==='dashboard')  { renderDashboard(); refreshNextAction(); }
    if(name==='trips')      renderTrips();
    if(name==='archive')    renderArchive();
    if(name==='students')   renderStudents();
    if(name==='deca')       renderOrgHub();
    if(name==='competency') renderCompetencyView();
    if(name==='lessons') {
      const lf = LS.get('lh_lp_filter', null);
      if (lf) {
        const cs = document.getElementById('lp-filter-course'); if(cs&&lf.course) cs.value=lf.course;
        const qs = document.getElementById('lp-filter-q');      if(qs&&lf.q)      qs.value=lf.q;
      }
      renderLessonPlans(); renderObsChecklist(); setTimeout(()=>lpSetView(_lpCurrentView),50);
    }
    if(name==='wbl')     renderWBLTracker();
    if(name==='esports') { renderESRoster(); renderSSBUChecklist(); renderMK8Checklist(); renderMatchLog(); }
    if(name==='events')  { renderEvents(); renderDECAPipeline(); }
    if(name==='goals')   renderGoals();
    if(name==='tripflow') initTripFlowView();
    if(name==='forms')   initFormsView();
    if(name==='slips')   initSlipView();
    // ── Accordion: open the section that owns this view ───────────────────
    const _accKeys = ['dashboard','class','trips','deca','wbl','esports','tools'];
    const _accMap  = {
      dashboard:'dashboard', competency:'class', lessons:'class',
      trips:'trips', tripflow:'trips', slips:'trips', forms:'trips', archive:'trips',
      deca:'deca', events:'deca', students:'deca', goals:'deca',
      wbl:'wbl', esports:'esports',
    };
    const accKey = _accMap[name];
    if(accKey && !window._appBooting) {
      // FIXED: this only ever toggled the .open class — toggleAcc() (a
      // direct sidebar-header click) also syncs aria-expanded and each
      // section's .si buttons' tabindex via _setAccBodyTabbable(). Any
      // navigation that reaches showView() another way (Dashboard's Next
      // Action "Go" button, Current-Class/Lessons shortcuts, inline
      // showView() links elsewhere) used to visually open the owning
      // section while leaving its links untabbable and its header still
      // announced as collapsed to a screen reader.
      _accKeys.forEach(k=>{
        const h=document.getElementById('acc-'+k), b=document.getElementById('accb-'+k);
        if(h&&b){ h.classList.remove('open'); b.classList.remove('open'); h.setAttribute('aria-expanded','false'); _setAccBodyTabbable(b, false); }
      });
      const th=document.getElementById('acc-'+accKey), tb=document.getElementById('accb-'+accKey);
      if(th&&tb){ th.classList.add('open'); tb.classList.add('open'); th.setAttribute('aria-expanded','true'); _setAccBodyTabbable(tb, true); }
    }
  } catch(e) {
    console.error('showView('+name+') crashed:', e);
    const eb = document.createElement('div');
    eb.style.cssText='position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:.75rem 1.25rem;border-radius:8px;font-family:monospace;font-size:.75rem;z-index:9999;max-width:80vw;';
    eb.textContent='Nav error ('+name+'): '+e.message;
    document.body.appendChild(eb);
    setTimeout(()=>eb.remove(),8000);
  }
}

function renderDashboard() {
  // Guard all IDs — some were removed in dashboard redesign
  const safeSet = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };

  safeSet('live-date', new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}));

  // ── STATS ──
  safeSet('d-trips', trips.length);
  const totalMissing = trips.reduce((sum, t) => sum + getMissingFields(t).length, 0);
  const readyCount = trips.filter(t => getMissingFields(t).length === 0).length;
  safeSet('d-ready', readyCount);
  safeSet('d-miss', totalMissing);

  // ── SIDEBAR BADGES ──
  safeSet('cnt-ft', trips.length);
  safeSet('cnt-deca', otherEvents.filter(e=>e.type==='deca').length);
  safeSet('cnt-lead', otherEvents.filter(e=>e.type==='leadership').length);
  safeSet('cnt-comm', otherEvents.filter(e=>e.type==='community').length);
  const deadlineSoon = trips.filter(t=>{ const dl=subDeadline(t); if(!dl)return false; const d=Math.ceil((dl-new Date())/86400000); return d>=0&&d<=14&&t.status==='planned'; });
  const missingTrips = trips.filter(t=>getMissingFields(t).length>0);
  safeSet('cnt-miss', missingTrips.length);
  safeSet('cnt-dl', deadlineSoon.length);

  // ── PRIORITY ALERTS ──
  const alts = [];
  trips.forEach(t => {
    const dl = subDeadline(t); if(!dl) return;
    const dtd = Math.ceil((dl-new Date())/86400000);
    const miss = getMissingFields(t).length;
    // FIXED: was dtd<=7 here — the sidebar's own "deadlines soon" badge
    // count (cnt-dl, above) and the Trips Hub/readiness-card urgency
    // signals all use a 14-day window. The same trip 8-14 days out used to
    // count toward that badge without ever appearing in this alert list,
    // and separately showed "urgent" on its readiness card while this
    // banner (and the Trip Detail header, below) stayed calm — unified to
    // 14 days everywhere so one trip can't read as urgent on one screen and
    // fine on another.
    if(dtd < 0 && t.status==='planned') alts.push(`<div class="alert ad"><span class="aico">🚨</span><div><strong>${escH(t.name)}</strong> — TripTracker deadline <strong>OVERDUE</strong> by ${Math.abs(dtd)} day${Math.abs(dtd)===1?'':'s'}. Submit immediately.</div></div>`);
    else if(dtd<=14 && dtd>=0 && t.status==='planned') alts.push(`<div class="alert aw"><span class="aico">⚠️</span><div><strong>${escH(t.name)}</strong> — TripTracker submission in <strong>${dtd} day${dtd===1?'':'s'}</strong> (${fd(fmtDeadline(t))}). ${miss>0?`<strong>${miss} fields still missing!</strong>`:''}</div></div>`);
    if(miss > 0 && dtd > 14) alts.push(`<div class="alert aw"><span class="aico">📋</span><strong>${escH(t.name)}</strong> — <strong>${miss} required field${miss===1?'':'s'}</strong> missing. <button class="btn btn-outline btn-xs" onclick="openEditModal(${t.id})" style="margin-left:.5rem">Fill In →</button></div>`);
  });
  const dashAlerts = document.getElementById('dash-alerts');
  if(dashAlerts) dashAlerts.innerHTML = alts.slice(0,4).join('');

  // ── UPCOMING STRIP ──
  const allEvs = [...trips.map(t=>({name:t.name,date:t.date,type:'fieldtrip'})), ...otherEvents.map(e=>({name:e.name,date:e.date,type:e.type}))].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6);
  const stripEvs = document.getElementById('strip-evs');
  if(stripEvs) stripEvs.innerHTML = allEvs.map(e=>{ const d=dn(e.date);const w=d<=7&&d>=0; return`<div class="se${w?' warn':''}"><strong>${escH(e.name)}</strong><span>${fd(e.date)} · ${du(e.date)}</span></div>`; }).join('');

  // ── FORM COMPLETION HUB ──
  renderFormHub();

  // ── PRIORITY ACTIONS ──
  renderDashPriorityActions();

  // ── SLIP STATUS PANEL ──
  renderDashSlips();
}

// ─── FORM COMPLETION HUB — the main dashboard workhorse ───────────────────
function renderFormHub() {
  const hub = document.getElementById('dash-form-hub');
  if(!hub) return;
  if(!trips.length) {
    hub.innerHTML = `<div class="card" style="text-align:center;padding:2rem;color:var(--muted)">No field trips yet. <button class="btn btn-primary btn-sm" onclick="openModal('newTrip')" style="margin-left:.75rem">+ Add Trip</button></div>`;
    return;
  }

  hub.innerHTML = trips.map(t => {
    const today = new Date();
    const tripDate = t.date ? new Date(t.date+'T00:00:00') : null;
    const dl = subDeadline(t);
    const dtd = dl ? Math.ceil((dl-today)/86400000) : 999;
    const daysToTrip = tripDate ? Math.ceil((tripDate-today)/86400000) : 999;
    const lead = leadDays(t.sub||'same-day');

    // ── FORM 1: TripTracker Permission Request Attachment ──
    const rfMissing = getMissingFields(t);
    const rfPct = getReadinessPct(t);
    const rfDone = rfMissing.length === 0;

    // ── FORM 2: FT Permission Form (parent/student) ──
    const fpMissing = getMissingFTPermFields(t.id);
    const fpDone = fpMissing.length === 0;
    const fpPct = Math.round(((5-fpMissing.length)/5)*100);

    // ── FORM 3: Conference/Leave Request ──
    const clKey = 't'+t.id;
    const clRec = confLeaveRecords[clKey] || {};
    const clMissing = CONF_REQUIRED.filter(k => !clRec[k] && !(k==='conf' && t.name));
    const clDone = clMissing.length === 0;
    const clPct = Math.round(((CONF_REQUIRED.length-clMissing.length)/CONF_REQUIRED.length)*100);

    // ── SLIPS ──
    const slips = getSlipStats(t.id);
    const slipPct = slips.total ? Math.round((slips.returned/slips.total)*100) : 0;

    // ── OVERALL TRIP READINESS ──
    const allFormsTotal = 3; // TripTracker + FT Perm + Conf Leave
    const allFormsDone = (rfDone?1:0) + (fpDone?1:0) + (clDone?1:0);
    const overallPct = Math.round((allFormsDone/allFormsTotal)*100);

    // ── PACING PHASES ──
    // Each phase has: label, dueDate, status (done|active|warn|future), action
    const phases = [];

    // Phase 1: Fill TripTracker form
    const p1Done = rfDone;
    phases.push({
      n:'1', icon:'📋',
      label:'Complete TripTracker Form',
      sub: p1Done ? `All ${REQUIRED_FIELDS.length} required fields filled` : `${rfMissing.length} field${rfMissing.length===1?'':'s'} still missing`,
      dueLabel: dl ? `Submit by ${fd(fmtDeadline(t))}` : 'No date set',
      // FIXED: was dtd<=7 — out of step with this same card's header banner
      // (urgColor/urgLabel below), which Round 6 unified to a 14-day
      // cutoff for the identical TripTracker submit deadline. A trip 8-14
      // days out showed an orange "urgent" header while this tile — for
      // the step most directly tied to that same deadline — stayed gray
      // "future" right underneath it.
      state: p1Done ? 'done' : dtd<0 ? 'warn' : dtd<=14 ? 'active' : 'future',
      action: p1Done ? null : {label:'✏️ Fill In', fn:`openEditModal(${t.id})`},
      action2: p1Done ? {label:'📄 Preview', fn:`generateFormPreview(${t.id})`} : null,
      badge: p1Done ? '✓ Complete' : rfMissing.length+' missing',
      badgeCls: p1Done ? 'st-approved' : dtd<=14 ? 'st-urgent' : 'st-pending',
    });

    // Phase 2: Fill FT Permission Form (parent handout)
    phases.push({
      n:'2', icon:'👨‍👩‍👧',
      label:'Print & Distribute FT Permission Forms',
      sub: fpDone ? `Header complete — print ${t.stuAtt||'?'} copies for parents` : `Missing: ${fpMissing.join(' · ')}`,
      dueLabel: dl ? `Complete before notifying students (${fd(fmtDeadline(t))})` : 'Complete before submission',
      state: fpDone ? 'done' : dtd<=14 ? 'active' : 'future',
      action: {label: fpDone ? '🖨 Print' : '✏️ Fill & Print', fn:`openFTPermFromTrip(${t.id})`},
      badge: fpDone ? '✓ Ready' : fpMissing.length+' missing',
      badgeCls: fpDone ? 'st-approved' : 'st-pending',
    });

    // Phase 3: Conf/Leave Request
    const clCatNote = clRec.cat==='I' ? 'Principal + Director' : clRec.cat==='II' ? 'Principal' : clRec.cat==='IV' ? 'Principal + Director + CAO' : 'Principal only';
    phases.push({
      n:'3', icon:'✈️',
      label:'Submit Conference/Leave Request (PR3)',
      sub: clDone ? `Category ${clRec.cat||'III'} — needs ${clCatNote} signature` : `Missing: ${clMissing.map(k=>({emp:'Employee Name',pos:'Position',school:'School',conf:'Conference Name',city:'Location',dates:'Date(s)',cat:'Category'})[k]||k).join(' · ')}`,
      dueLabel: 'Submit in advance to Principal',
      state: clDone ? 'done' : dtd<=21 ? 'active' : 'future',
      action: {label: clDone ? '🖨 Print' : '✏️ Fill In', fn:`openConfFromTrip(${t.id})`},
      badge: clDone ? '✓ Ready' : clMissing.length+' missing',
      badgeCls: clDone ? 'st-approved' : 'st-pending',
    });

    // Phase 4: Submit to TripTracker
    phases.push({
      n:'4', icon:'🖥',
      label:'Submit to TripTracker System',
      sub: dtd<0&&t.status==='planned' ? '⚠ OVERDUE — submit immediately' : rfDone ? `Ready to submit — deadline ${fd(fmtDeadline(t))}` : 'Complete form first',
      dueLabel: dl ? fd(fmtDeadline(t)) + ` (${lead}-day rule)` : 'No date set',
      // FIXED: same 7-day-vs-14-day mismatch as Phase 1 above.
      state: t.status==='active'||t.status==='approved'||t.status==='complete' ? 'done' : !rfDone ? 'future' : dtd<0 ? 'warn' : dtd<=14 ? 'active' : 'future',
      action: null,
      badge: t.status==='active'||t.status==='approved' ? '✓ Submitted' : dtd<0&&t.status==='planned' ? 'OVERDUE' : dtd<=14&&t.status==='planned' ? dtd+'d left' : rfDone ? 'Ready' : 'Waiting',
      badgeCls: t.status==='active'||t.status==='approved' ? 'st-approved' : dtd<0&&t.status==='planned' ? 'st-urgent' : dtd<=14&&t.status==='planned' ? 'st-urgent' : 'st-planned',
    });

    // Phase 5: Collect Permission Slips
    const slipState = slips.total===0?'future':slips.returned===slips.total?'done':daysToTrip<=7?'warn':'active';
    phases.push({
      n:'5', icon:'📝',
      label:'Collect Signed Permission Slips',
      sub: slips.total===0 ? 'No students added yet' : `${slips.returned}/${slips.total} returned · ${slips.missing} missing · ${slips.pending} pending`,
      dueLabel: tripDate ? `Due before trip (${fd(t.date)})` : 'Before trip date',
      state: slipState,
      action: {label:'📝 Manage Slips', fn:`showView('slips');setTimeout(()=>{document.getElementById('slip-trip-sel').value=${t.id};renderSlipView();},60)`},
      badge: slips.total===0 ? '—' : slipPct+'%',
      badgeCls: slips.total===0?'st-complete':slipPct===100?'st-approved':slipPct>=50?'st-pending':'st-urgent',
    });

    // Phase 6: Trip Day
    const tripDone = daysToTrip < 0;
    phases.push({
      n:'6', icon:'🚌',
      label:'Trip Departs',
      sub: t.depTime&&t.retTime ? `Depart ${t.depTime} — Return ${t.retTime}` : 'Times TBD',
      dueLabel: t.date ? fd(t.date) : 'Date TBD',
      state: tripDone ? 'done' : daysToTrip===0 ? 'active' : 'future',
      action: null,
      badge: tripDone ? '✓ Complete' : daysToTrip>0 ? daysToTrip+'d away' : 'Today!',
      badgeCls: tripDone ? 'st-complete' : daysToTrip<=1 ? 'st-urgent' : 'st-planned',
    });

    // Urgency color for the trip card header. FIXED: was a 7-day cutoff,
    // out of step with the Dashboard alert banner and readiness card, which
    // both flag the same trip's deadline urgency at 14 days — see the fix
    // note above renderDashboard()'s alert-banner logic.
    const urgColor = dtd<0&&t.status==='planned' ? 'var(--red)' : dtd<=14&&t.status==='planned' ? 'var(--orange)' : 'var(--green)';
    const urgLabel = dtd<0&&t.status==='planned' ? '🚨 OVERDUE' : dtd<=14&&t.status==='planned' ? `⏰ ${dtd}d to submit` : rfDone&&fpDone&&clDone ? '✅ Forms Ready' : `${lead}d lead rule`;

    return `<div class="card" style="border-left:4px solid ${urgColor};padding:0;overflow:hidden">
      <!-- Trip header -->
      <div style="background:var(--navy);color:#fff;padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
        <div>
          <div style="font-family:'Bebas Neue',cursive;font-size:1.25rem;letter-spacing:2px">${escH(t.name)}</div>
          <div style="font-size:.71rem;color:rgba(255,255,255,.55)">📅 ${fd(t.date)} &nbsp;·&nbsp; ${du(t.date)} &nbsp;·&nbsp; ${t.sub?.replace('-',' ')||'same day'} &nbsp;·&nbsp; ${escH(t.dest1||'Destination TBD')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
          <span style="font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;background:${dtd<0&&t.status==='planned'?'var(--red)':dtd<=14&&t.status==='planned'?'var(--orange)':'rgba(255,255,255,.15)'};color:#fff">${urgLabel}</span>
          <div style="font-size:.68rem;text-align:center"><div style="font-family:'Bebas Neue',cursive;font-size:1.5rem;line-height:1;color:${overallPct===100?'#4ade80':'var(--gold)'}">${overallPct}%</div><div style="color:rgba(255,255,255,.45)">forms done</div></div>
        </div>
      </div>

      <!-- Overall progress bar -->
      <div style="height:4px;background:rgba(0,0,0,.12)"><div style="height:100%;background:${overallPct===100?'var(--green)':'var(--gold)'};width:${overallPct}%;transition:width .5s"></div></div>

      <!-- Phases grid -->
      <div style="padding:.85rem 1.1rem">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem">
          ${phases.map(p => {
            const stateColor = p.state==='done'?'var(--green)':p.state==='warn'?'var(--red)':p.state==='active'?'var(--gold)':'#ccc';
            const stateBg = p.state==='done'?'#f0fdf4':p.state==='warn'?'#fef2f2':p.state==='active'?'#fffbeb':'#f9f9f9';
            const iconBg = p.state==='done'?'var(--green)':p.state==='warn'?'var(--red)':p.state==='active'?'var(--gold)':'#ccc';
            return `<div style="background:${stateBg};border:1px solid ${stateColor};border-radius:8px;padding:.6rem .75rem">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
                <div style="display:flex;align-items:center;gap:.35rem">
                  <div style="width:22px;height:22px;border-radius:50%;background:${iconBg};color:${p.state==='active'?'var(--navy)':'#fff'};display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0">${p.state==='done'?'✓':p.n}</div>
                  <span style="font-size:.75rem;font-weight:700;color:${p.state==='done'?'var(--green)':p.state==='warn'?'var(--red)':p.state==='active'?'#7a5900':'#888'}">${p.icon}</span>
                </div>
                <span class="status ${p.badgeCls}" style="font-size:.58rem">${p.badge}</span>
              </div>
              <div style="font-size:.77rem;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:.2rem">${p.label}</div>
              <div style="font-size:.69rem;color:#666;line-height:1.4;margin-bottom:.35rem">${p.sub}</div>
              <div style="font-size:.63rem;color:var(--muted);margin-bottom:.4rem">📅 ${p.dueLabel}</div>
              <div style="display:flex;gap:.3rem;flex-wrap:wrap">
                ${p.action?`<button class="btn btn-primary btn-xs" onclick="${p.action.fn}">${p.action.label}</button>`:''}
                ${p.action2?`<button class="btn btn-outline btn-xs" onclick="${p.action2.fn}">${p.action2.label}</button>`:''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── PRIORITY ACTION ENGINE ────────────────────────────────────────────────────
// Surfaces the highest-urgency actions across all trips, sorted by deadline proximity
function renderDashPriorityActions() {
  const el = document.getElementById('dash-priority-actions');
  if(!el) return;
  const today = new Date();
  const actions = [];

  trips.forEach(t => {
    const dl = subDeadline(t);
    const dtd = dl ? Math.ceil((dl-today)/86400000) : 999;
    const daysToTrip = t.date ? Math.ceil((new Date(t.date+'T00:00:00')-today)/86400000) : 999;
    const lead = leadDays(t.sub||'same-day');

    // ── FORM 1: TripTracker Permission Request Attachment ──
    const rfMissing = getMissingFields(t);
    if(rfMissing.length > 0) {
      const urgency = dtd < 0 ? 0 : dtd <= 3 ? 1 : dtd <= 7 ? 2 : dtd <= 14 ? 3 : 10;
      const sev = dtd < 0 ? 'ad' : dtd <= 7 ? 'aw' : 'ai';
      const sevIcon = dtd < 0 ? '🚨' : dtd <= 7 ? '⚠️' : '📋';
      actions.push({
        urgency, sev, icon: sevIcon,
        trip: t.name,
        title: `Complete TripTracker Form — ${rfMissing.length} field${rfMissing.length===1?'':'s'} missing`,
        detail: `Missing: ${rfMissing.slice(0,3).map(f=>f.label).join(', ')}${rfMissing.length>3?' + '+(rfMissing.length-3)+' more':''}`,
        deadline: dl ? `Submit by ${fd(dl.toISOString().split('T')[0])} (${lead}-day rule · ${dtd<0?Math.abs(dtd)+' day'+(Math.abs(dtd)===1?'':'s')+' OVERDUE':dtd+'d left'})` : 'No trip date set',
        btnLabel: '✏️ Fill In Form',
        btnFn: `openEditModal(${t.id})`,
        btn2Label: rfMissing.length < 5 ? '📄 Preview' : null,
        btn2Fn: `generateFormPreview(${t.id})`,
      });
    }

    // ── FORM 2: FT Permission/Risk Form (parent handout) ──
    const fpMissing = getMissingFTPermFields(t.id);
    if(fpMissing.length > 0) {
      const urgency = dtd < 0 ? 1 : dtd <= 7 ? 3 : dtd <= 14 ? 4 : 11;
      actions.push({
        urgency, sev: dtd <= 14 ? 'aw' : 'ai', icon: '👨‍👩‍👧',
        trip: t.name,
        title: `Print FT Permission & Risk Form — ${fpMissing.length} header field${fpMissing.length===1?'':'s'} missing`,
        detail: `Missing: ${fpMissing.join(', ')}. Print one per student for parents to sign.`,
        deadline: `Complete before notifying students (after all approvals received)`,
        btnLabel: '✏️ Fill & Print',
        btnFn: `openFTPermFromTrip(${t.id})`,
      });
    }

    // ── FORM 3: Conference/Leave Request ──
    const clKey = 't'+t.id;
    const clRec = confLeaveRecords[clKey] || {};
    const clMissing = CONF_REQUIRED.filter(k => !clRec[k] && !(k==='conf' && t.name));
    if(clMissing.length > 0) {
      const clLabels = {emp:'Employee Name',pos:'Position',school:'School',conf:'Conference Name',city:'Location',dates:'Date(s)',cat:'Leave Category'};
      const urgency = dtd <= 21 ? 2 : 12;
      actions.push({
        urgency, sev: 'ai', icon: '✈️',
        trip: t.name,
        title: `Submit Conference/Leave Request (PR3) — ${clMissing.length} field${clMissing.length===1?'':'s'} needed`,
        detail: `Missing: ${clMissing.map(k=>clLabels[k]||k).join(', ')}. Submit in advance to Principal.`,
        deadline: `Submit before trip — Category III (Field Trips) requires Principal signature only`,
        btnLabel: '✏️ Fill In',
        btnFn: `openConfFromTrip(${t.id})`,
      });
    }

    // ── SLIPS: Missing permission slips close to trip ──
    const slips = getSlipStats(t.id);
    if(slips.missing > 0 && daysToTrip <= 14 && daysToTrip >= 0) {
      actions.push({
        urgency: daysToTrip <= 3 ? 1 : daysToTrip <= 7 ? 2 : 4,
        sev: daysToTrip <= 3 ? 'ad' : 'aw', icon: '📝',
        trip: t.name,
        title: `${slips.missing} signed permission slip${slips.missing===1?'':'s'} not returned`,
        detail: `${slips.returned}/${slips.total} returned · ${slips.pending} pending · Trip in ${daysToTrip} day${daysToTrip===1?'':'s'}`,
        deadline: `Slips due before trip departs (${fd(t.date)})`,
        btnLabel: '📝 Manage Slips',
        btnFn: `showView('slips');setTimeout(()=>{document.getElementById('slip-trip-sel').value=${t.id};renderSlipView();},60)`,
      });
    }

    // ── APPROVALS pending ──
    // Same dead-string bug as leadDays() above — 'out-of-state'/'overnight'
    // never match anything the wizard can produce, so no wizard-created
    // overnight/multi-day trip ever got the Director/Chief-of-Schools
    // approval steps added.
    const apSteps = ['overnight-is','overnight-oos','multi-day','international'].includes(t.sub||'same-day')
      ? ['coord','principal','bookkeeper','risk','director','chief','transport']
      : ['coord','principal','bookkeeper','risk','transport'];
    const pendingAp = apSteps.filter(k => !t.ap?.[k]);
    if(pendingAp.length > 0 && dtd <= 21) {
      const apLabels = {coord:'Coordinator',principal:'Principal',bookkeeper:'Bookkeeper',risk:'Risk Mgmt',director:'Level Director',chief:'Chief of Schools',transport:'Transportation'};
      actions.push({
        urgency: dtd <= 7 ? 3 : 6, sev: 'aw', icon: '✅',
        trip: t.name,
        title: `${pendingAp.length} approval${pendingAp.length===1?'':'s'} still needed`,
        detail: `Awaiting: ${pendingAp.map(k=>apLabels[k]).join(' → ')}`,
        deadline: dl ? `TripTracker deadline: ${fd(dl.toISOString().split('T')[0])}` : '',
        btnLabel: '📋 View Details',
        btnFn: `openTripDetail(${t.id})`,
      });
    }
  });

  // Sort by urgency (lower = more urgent)
  actions.sort((a,b) => a.urgency - b.urgency);

  if(!actions.length) {
    el.innerHTML = `<div class="alert as"><span class="aico">✅</span><strong>All caught up!</strong> No urgent actions needed right now. All forms are complete and slips are on track.</div>`;
    return;
  }

  // Group into: Do Now (urgency < 4) vs Coming Up (4–8) vs Later (>8)
  const doNow = actions.filter(a=>a.urgency < 4);
  const soonish = actions.filter(a=>a.urgency >= 4 && a.urgency <= 8);
  const later = actions.filter(a=>a.urgency > 8);

  const renderGroup = (items, label, collapsed) => {
    if(!items.length) return '';
    return `
      <div style="margin-bottom:.85rem">
        <div style="font-size:.67rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem">${label}</div>
        <div style="display:flex;flex-direction:column;gap:.5rem">
          ${items.map(a=>`
            <div class="alert ${a.sev}" style="padding:.6rem .85rem;align-items:flex-start;gap:.6rem">
              <span class="aico" style="font-size:1rem">${a.icon}</span>
              <div style="flex:1">
                <div style="font-size:.69rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:inherit;opacity:.7;margin-bottom:.1rem">${escH(a.trip)}</div>
                <div style="font-weight:700;font-size:.81rem;margin-bottom:.18rem">${a.title}</div>
                <div style="font-size:.74rem;opacity:.85;line-height:1.45;margin-bottom:.28rem">${a.detail}</div>
                <div style="font-size:.67rem;opacity:.7;margin-bottom:.35rem">📅 ${a.deadline}</div>
                <div style="display:flex;gap:.35rem;flex-wrap:wrap">
                  <button class="btn btn-primary btn-xs" onclick="${a.btnFn}">${a.btnLabel}</button>
                  ${a.btn2Label&&a.btn2Fn?`<button class="btn btn-outline btn-xs" onclick="${a.btn2Fn}">${a.btn2Label}</button>`:''}
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  };

  el.innerHTML =
    renderGroup(doNow,    '🔴 Do Now') +
    renderGroup(soonish,  '🟡 Do Soon — Within 3 Weeks') +
    renderGroup(later,    '🔵 On the Horizon — Complete When Ready');
}

// ─── OPEN FORMS DIRECTLY FROM A TRIP ID ──────────────────────────────────────
function openFTPermFromTrip(tripId) {
  showView('forms');
  setTimeout(() => {
    fTab('ftperm', document.getElementById('ftab-ftperm'));
    const sel = document.getElementById('ftperm-trip');
    if(sel) { sel.value = tripId; renderFTPermForm(); }
    openFTPermFill();
  }, 80);
}

function openConfFromTrip(tripId) {
  showView('forms');
  setTimeout(() => {
    fTab('confleave', document.getElementById('ftab-confleave'));
    const sel = document.getElementById('conf-event');
    if(sel) { sel.value = 't'+tripId; renderConfLeaveForm(); }
    openConfFill();
  }, 80);
}

// ─── DASHBOARD SLIP STATUS PANEL ─────────────────────────────────────────────
function renderDashSlips() {
  const el = document.getElementById('dash-slips');
  if(!el) return;
  if(!trips.length) { el.innerHTML = '<div style="color:var(--muted);font-size:.82rem">No trips yet.</div>'; return; }
  el.innerHTML = trips.map(t => {
    const s = getSlipStats(t.id);
    const pct = s.total ? Math.round(s.returned/s.total*100) : 0;
    const cls = pct===100?'pf-ok':pct>=50?'pf-warn':'pf-danger';
    return `<div style="margin-bottom:.7rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.18rem">
        <span style="font-size:.79rem;font-weight:600">${escH(t.name)}</span>
        <button class="btn btn-outline btn-xs" onclick="showView('slips');setTimeout(()=>{document.getElementById('slip-trip-sel').value=${t.id};renderSlipView();},60)">Manage</button>
      </div>
      ${s.total ? `
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.1rem">
          <div class="pbar" style="flex:1"><div class="pfill ${cls}" style="width:${pct}%"></div></div>
          <span style="font-size:.67rem;font-family:'DM Mono',monospace;min-width:60px;text-align:right;color:${pct===100?'var(--green)':pct<50?'var(--red)':'var(--orange)'}">${s.returned}/${s.total} back</span>
        </div>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap">
          ${s.missing>0?`<span class="status st-urgent">⚠ ${s.missing} missing</span>`:''}
          ${s.pending>0?`<span class="status st-pending">⏳ ${s.pending} pending</span>`:''}
          ${s.parent>0?`<span class="status st-planned">🚗 ${s.parent} own transport</span>`:''}
          ${pct===100?`<span class="status st-approved">✅ All returned</span>`:''}
        </div>` :
        `<div style="font-size:.75rem;color:var(--muted)">No students added yet. <button class="btn btn-outline btn-xs" onclick="showView('slips')">Add →</button></div>`
      }
    </div>`;
  }).join('');
}

function renderReadinessCard(t, compact=false) {
  const pct = getReadinessPct(t);
  const missing = getMissingFields(t);
  const dl = subDeadline(t);
  const dtd = dl ? Math.ceil((dl-new Date())/86400000) : 999;
  const pclass = pct===100?'pf-ok':pct>=60?'pf-blue':'pf-danger';
  return `<div class="rcard">
    <div class="rcard-top">
      <div>
        <div class="rcard-name">${escH(t.name)}${t.archived?' <span title="This trip has an Archive snapshot — editing it does not update the snapshot" style="font-size:.62rem;font-weight:700;color:#7c3aed;background:#ede9fe;padding:.1rem .4rem;border-radius:4px;vertical-align:middle">📦 ARCHIVED</span>':''}</div>
        <div style="font-size:.72rem;color:var(--muted);margin-top:.15rem">📅 ${fd(t.date)} &nbsp;·&nbsp; ${du(t.date)}</div>
        ${dtd<0&&t.status==='planned'?`<div class="alert ad" style="margin-top:.4rem;padding:.3rem .6rem;font-size:.72rem"><span class="aico">🚨</span>Deadline OVERDUE</div>`:dtd<=14&&dtd>=0&&t.status==='planned'?`<div class="alert aw" style="margin-top:.4rem;padding:.3rem .6rem;font-size:.72rem"><span class="aico">⚠️</span>Submit in ${dtd} day${dtd===1?'':'s'}</div>`:''}
      </div>
      <div style="text-align:center">
        <div class="rcard-pct">${pct}%</div>
        <div style="font-size:.65rem;color:var(--muted)">complete</div>
      </div>
    </div>
    <div class="pbar" style="margin-bottom:.65rem"><div class="pfill ${pclass}" style="width:${pct}%"></div></div>
    ${missing.length ? `
      <div style="margin-bottom:.5rem">
        <div style="font-size:.7rem;font-weight:700;color:var(--red);margin-bottom:.3rem">⚠ ${missing.length} Required Field${missing.length===1?'':'s'} Missing</div>
        ${missing.slice(0,4).map(f=>`<div class="field-row"><div class="field-dot fd-miss"></div><div class="field-name">${f.label}</div><span style="font-size:.68rem;color:var(--muted)">${f.section}</span></div>`).join('')}
        ${missing.length>4?`<div style="font-size:.7rem;color:var(--muted);padding:.2rem .4rem">+${missing.length-4} more...</div>`:''}
      </div>` : `<div class="alert as" style="font-size:.74rem"><span class="aico">✅</span>All required fields complete! Ready for TripTracker.</div>`}
    <div style="display:flex;gap:.4rem;margin-top:.55rem;flex-wrap:wrap">
      <button class="btn btn-primary btn-xs" onclick="openTripDetail(${t.id})">📋 View Details</button>
      <button class="btn btn-outline btn-xs" onclick="openEditModal(${t.id})">✏️ Fill In</button>
      <button class="btn btn-outline btn-xs" onclick="showView('slips');setTimeout(()=>{document.getElementById('slip-trip-sel').value=${t.id};renderSlipView();},60)">📝 Slips</button>
      <button class="btn btn-outline btn-xs" onclick="openEmailComposerForTrip(${t.id},'parents')">✉️ Email</button>
      <button class="btn btn-outline btn-xs" onclick="openArchiveModal(${t.id})" style="color:#7c3aed;border-color:#c4b5fd">${t.archived?'🔄 Update Archive':'📦 Archive'}</button>
      ${pct===100?`<button class="btn btn-green btn-xs" onclick="generateFormPreview(${t.id})">📄 Preview Form</button>`:''}
      <button class="btn btn-xs" onclick="deleteTrip(${t.id})" style="color:#dc2626;border-color:#fecaca;background:#fff;border:1px solid #fecaca;border-radius:5px;font-size:.68rem;padding:.18rem .5rem;cursor:pointer;font-weight:700">✕ Delete</button>
    </div>
  </div>`;
}
